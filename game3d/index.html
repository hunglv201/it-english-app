<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<script>/* CSP chỉ khi tự host (GitHub Pages/localhost) */(function(){if(!/(^|\.)github\.io$|^localhost$|^127\.0\.0\.1$/.test(location.hostname))return;var m=document.createElement("meta");m.httpEquiv="Content-Security-Policy";m.content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; media-src 'self' data: blob:; connect-src 'self' https://generativelanguage.googleapis.com https://api.anthropic.com https://api.groq.com; object-src 'none'; base-uri 'none'; form-action 'none'";document.head.appendChild(m);})();</script>
<title>Nói Nghề 3D — Ngày đầu đi làm</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<meta name="theme-color" content="#1b2340">
<meta name="description" content="Game 3D low-poly luyện tiếng Anh công sở: một ngày đầu đi làm, năm cuộc hội thoại, chọn câu đáp để gây ấn tượng.">
<style>
:root{--bg:#1b2340;--card:rgba(20,26,50,.92);--line:rgba(255,255,255,.14);--tx:#f4f6ff;--mut:#aab3d6;--ok:#4ade80;--bad:#fb7185;--acc:#fbbf24;--blue:#60a5fa}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overflow:hidden;overscroll-behavior:none}
#c{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
#hud{position:fixed;left:0;right:0;top:0;padding:calc(env(safe-area-inset-top) + 8px) 12px 0;display:flex;gap:8px;align-items:center;pointer-events:none;z-index:3}
#hud>*{pointer-events:auto}
.pill{background:var(--card);border:1px solid var(--line);border-radius:999px;padding:6px 12px;font-size:13px;font-weight:700;white-space:nowrap;backdrop-filter:blur(6px)}
a.pill{color:var(--tx);text-decoration:none}
#imp{flex:1;min-width:0;display:flex;align-items:center;gap:8px}
#imp .bar{flex:1;height:8px;border-radius:99px;background:rgba(255,255,255,.15);overflow:hidden}
#imp .bar i{display:block;height:100%;width:50%;background:linear-gradient(90deg,var(--bad),var(--acc),var(--ok));transition:width .5s}
#panel{position:fixed;left:0;right:0;bottom:0;z-index:4;padding:12px 12px calc(env(safe-area-inset-bottom) + 12px);background:linear-gradient(to top,rgba(10,14,32,.97) 70%,rgba(10,14,32,0));max-height:64vh;overflow:auto}
.box{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px 14px;display:flex;flex-direction:column;gap:10px}
.who{font-size:12px;font-weight:800;letter-spacing:.04em;color:var(--acc);text-transform:uppercase;display:flex;align-items:center;gap:8px}
.line{font-size:17px;line-height:1.4;font-weight:600}
.vi{font-size:13px;color:var(--mut)}
.opt{display:block;width:100%;text-align:left;background:rgba(255,255,255,.08);border:1px solid var(--line);color:var(--tx);border-radius:12px;padding:11px 12px;font-size:15px;line-height:1.35;min-height:44px;font-family:inherit}
.opt:active{transform:scale(.985)}
.opt.ok{background:rgba(74,222,128,.18);border-color:var(--ok)}
.opt.no{background:rgba(251,113,133,.18);border-color:var(--bad)}
.btn{border:0;border-radius:12px;padding:12px 14px;min-height:44px;font-size:15px;font-weight:800;background:var(--acc);color:#251a00;font-family:inherit;cursor:pointer}
.btn.ghost{background:rgba(255,255,255,.1);color:var(--tx);border:1px solid var(--line)}
.btn.blue{background:var(--blue);color:#06142e}
.row{display:flex;gap:8px;align-items:center}
.row>.grow{flex:1;min-width:0}
h2{margin:0;font-size:22px}
.muted{color:var(--mut);font-size:13px;line-height:1.45}
.fb{font-size:14px;line-height:1.45;padding:8px 10px;border-radius:10px}
.fb.ok{background:rgba(74,222,128,.15)}.fb.no{background:rgba(251,113,133,.15)}
input.tx{flex:1;min-width:0;background:rgba(255,255,255,.1);border:1px solid var(--line);color:var(--tx);border-radius:12px;padding:11px 12px;font-size:16px;font-family:inherit;min-height:44px}
.chat{display:flex;flex-direction:column;gap:6px;max-height:26vh;overflow:auto}
.b{padding:7px 10px;border-radius:12px;font-size:14px;line-height:1.4;max-width:90%}
.b.me{align-self:flex-end;background:rgba(96,165,250,.25)}.b.ai{align-self:flex-start;background:rgba(255,255,255,.1)}
#toast{position:fixed;left:50%;top:60px;transform:translateX(-50%);background:var(--card);border:1px solid var(--line);padding:8px 14px;border-radius:99px;font-size:13px;z-index:9;opacity:0;transition:opacity .25s;pointer-events:none}
#toast.on{opacity:1}
#nogl{position:fixed;inset:0;display:none;align-items:center;justify-content:center;padding:24px;text-align:center;z-index:8}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<canvas id="c" aria-label="Văn phòng 3D"></canvas>
<div id="hud">
  <a class="pill" href="../game/" aria-label="Về game chính">←</a>
  <div class="pill" id="clock">08:30</div>
  <div class="pill" id="imp"><span>Ấn tượng</span><span class="bar"><i id="impbar"></i></span></div>
</div>
<div id="panel"></div>
<div id="toast"></div>
<div id="nogl"><div class="box"><h2>Máy chưa hỗ trợ 3D</h2><div class="muted">Trình duyệt này không bật được WebGL. Thử Chrome/Safari bản mới, hoặc chơi game 2D.</div><a class="btn" href="../game/" style="text-decoration:none;text-align:center">Về game chính</a></div></div>
<script>(function(){var T={office:1,it:1,hotel:1,sales:1,factory:1,logistics:1,finance:1,marketing:1,health:1,construction:1,aviation:1,education:1,legal:1,custom:1},t='',s=null;
try{s=JSON.parse(localStorage.getItem('it-english-v1')||'null');}catch(e){}
var q=(location.search.match(/[?&]track=([a-z]+)/)||[])[1];
if(q&&T[q])t=q;
else if(s&&s.cfg&&T[s.cfg.track])t=s.cfg.track;
else if(s&&((s.stats&&s.stats.placed)||Object.keys((s.days&&s.days.done)||{}).length||((s.days&&s.days.cur)||1)>1))t='it';
if(t==='custom'&&!(s&&s.customPack&&s.customPack.phases&&s.customPack.phases.length))t='office';
if(!T[t])t='office';window.TRACK=t;
if(t==='it')document.write('<script src="../data.gen.js"><\/script><script src="../phrases.gen.js"><\/script><script src="../roles.gen.js"><\/script>');
else if(t==='custom')document.write('<script src="../packs/office.gen.js"><\/script><script src="../packs/custom.js"><\/script>');
else document.write('<script src="../packs/'+t+'.gen.js"><\/script>');})();</script>
<script src="three.min.js"></script>
<script src="game3d.js"></script>
</body>
</html>
