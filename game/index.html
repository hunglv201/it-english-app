<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<title>IT English Quest</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#120b2e">
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20viewBox='0%200%20100%20100'%3E%3Cdefs%3E%3ClinearGradient%20id='g'%20x1='0'%20y1='0'%20x2='1'%20y2='1'%3E%3Cstop%20offset='0'%20stop-color='%23ff7eb6'/%3E%3Cstop%20offset='1'%20stop-color='%237c5cff'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect%20width='100'%20height='100'%20rx='26'%20fill='url(%23g)'/%3E%3Ccircle%20cx='38'%20cy='46'%20r='9'%20fill='%23fff'/%3E%3Ccircle%20cx='62'%20cy='46'%20r='9'%20fill='%23fff'/%3E%3Ccircle%20cx='40'%20cy='48'%20r='4.5'%20fill='%23222'/%3E%3Ccircle%20cx='64'%20cy='48'%20r='4.5'%20fill='%23222'/%3E%3Cpath%20d='M38%2066q12%2010%2024%200'%20stroke='%23fff'%20stroke-width='5'%20fill='none'%20stroke-linecap='round'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@500;700;800&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
:root{
  --bg1:#120b2e; --bg2:#1b1147; --panel:#221a4d; --panel2:#2a2160; --ink:#fff6ff; --muted:#c9bfe8; --faint:#8d83b8;
  --pink:#ff7eb6; --pink2:#ff4f9a; --blue:#5ec8ff; --blue2:#2f9cff; --violet:#a78bfa; --yellow:#ffd166; --mint:#5eead4; --red:#ff5c7a; --green:#7cf29a;
  --line:#3b2f7a; --stroke:#0d0826;
  --disp:'Fredoka','Nunito',system-ui,sans-serif; --sans:'Nunito',system-ui,sans-serif; --mono:'IBM Plex Mono',ui-monospace,monospace;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:var(--sans);color:var(--ink);background:radial-gradient(120% 80% at 20% 0%,#2b1a6a 0%,transparent 55%),radial-gradient(100% 70% at 90% 100%,#4a1650 0%,transparent 55%),linear-gradient(180deg,var(--bg1),var(--bg2));min-height:100%;overflow-x:hidden;-webkit-font-smoothing:antialiased}
button{font-family:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--yellow);outline-offset:2px;border-radius:12px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* stars background */
.stars{position:fixed;inset:0;pointer-events:none;z-index:0;background-image:radial-gradient(1.5px 1.5px at 20% 30%,#fff9 50%,transparent 51%),radial-gradient(1.2px 1.2px at 70% 20%,#fff7 50%,transparent 51%),radial-gradient(1px 1px at 40% 80%,#fff6 50%,transparent 51%),radial-gradient(1.6px 1.6px at 85% 60%,#fff8 50%,transparent 51%),radial-gradient(1px 1px at 10% 70%,#fff5 50%,transparent 51%),radial-gradient(1.3px 1.3px at 55% 50%,#fff6 50%,transparent 51%);background-size:420px 420px;animation:twinkle 6s ease-in-out infinite alternate}
@keyframes twinkle{from{opacity:.55}to{opacity:1}}
.petals{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden}
.petal{position:absolute;top:-5%;width:12px;height:12px;border-radius:12px 0;background:linear-gradient(135deg,#ffb6d5,#ff7eb6);opacity:.8;animation:fall linear infinite}
@keyframes fall{0%{transform:translateY(-10vh) rotate(0) translateX(0)}50%{transform:translateY(50vh) rotate(180deg) translateX(30px)}100%{transform:translateY(110vh) rotate(360deg) translateX(-20px)}}

.shell{position:relative;z-index:1;max-width:520px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column;padding:12px 14px calc(88px + env(safe-area-inset-bottom))}
.top{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:6px 2px 10px}
.brand{display:flex;align-items:center;gap:9px;font-family:var(--disp);font-weight:700;font-size:19px;letter-spacing:.2px}
.brand .ic{width:34px;height:34px;border-radius:11px;background:linear-gradient(135deg,var(--pink),var(--violet));box-shadow:0 4px 0 var(--stroke),0 8px 22px #ff7eb655;display:flex;align-items:center;justify-content:center}
.brand .ic svg{width:22px;height:22px}
.coins{display:inline-flex;align-items:center;gap:6px;background:var(--panel);border:2px solid var(--line);border-radius:999px;padding:6px 12px;font-family:var(--disp);font-weight:700;font-size:14px}
.coins i{width:16px;height:16px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#fff3b0,var(--yellow) 60%,#e0a800);box-shadow:0 0 0 2px #c98d00 inset}

/* panel / sticker style */
.card{background:var(--panel);border:3px solid var(--stroke);border-radius:22px;padding:16px;box-shadow:0 6px 0 var(--stroke),0 14px 30px #0006;position:relative}
.card.pop{animation:pop .35s cubic-bezier(.2,1.4,.4,1) both}
@keyframes pop{from{transform:scale(.92);opacity:0}to{transform:none;opacity:1}}
.h{font-family:var(--disp);font-weight:700;letter-spacing:.2px}
.eyebrow{font-family:var(--mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--pink)}
.muted{color:var(--muted)}
.row{display:flex;align-items:center;gap:10px}
.between{justify-content:space-between}
.grow{flex:1}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:52px;padding:0 20px;border-radius:16px;border:3px solid var(--stroke);
  background:linear-gradient(180deg,var(--pink),var(--pink2));color:#fff;font-family:var(--disp);font-weight:700;font-size:16px;box-shadow:0 5px 0 var(--stroke);transition:transform .08s,box-shadow .08s;text-decoration:none}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 var(--stroke)}
.btn.blue{background:linear-gradient(180deg,var(--blue),var(--blue2))}
.btn.violet{background:linear-gradient(180deg,#b79cff,#7c5cff)}
.btn.yellow{background:linear-gradient(180deg,#ffe08a,#ffb703);color:#3a2600}
.btn.mint{background:linear-gradient(180deg,#8ff5e3,#26c9b0);color:#062f28}
.btn.ghost{background:var(--panel2);color:var(--ink)}
.btn.sm{min-height:42px;padding:0 14px;font-size:14px;border-radius:13px}
.btn.block{width:100%}
.btn[disabled]{opacity:.45;pointer-events:none}

/* bars */
.bar{height:16px;border-radius:999px;background:#0e0a26;border:2px solid var(--stroke);overflow:hidden;position:relative}
.bar>i{display:block;height:100%;border-radius:999px;transition:width .35s cubic-bezier(.2,.8,.2,1)}
.bar.hp>i{background:linear-gradient(90deg,#7cf29a,#22c55e)}
.bar.hp.low>i{background:linear-gradient(90deg,#ff8a8a,#ff3b5c)}
.bar.xp>i{background:linear-gradient(90deg,#8ad9ff,#2f9cff)}
.bar.mon>i{background:linear-gradient(90deg,#ff9bb8,#ff4f9a)}
.bar.time>i{background:linear-gradient(90deg,#ffe08a,#ffb703)}
.bar span{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-family:var(--mono);font-size:10.5px;font-weight:600;color:#fff;text-shadow:0 1px 0 #0008}

/* player card */
.player{display:flex;gap:12px;align-items:center}
.avatar{width:72px;height:72px;border-radius:20px;background:linear-gradient(135deg,#3a2a8a,#5b3aa8);border:3px solid var(--stroke);box-shadow:0 4px 0 var(--stroke);display:flex;align-items:center;justify-content:center;overflow:hidden;flex:0 0 auto}
.avatar svg{width:100%;height:100%}
.lv{display:inline-flex;align-items:center;gap:6px;font-family:var(--disp);font-weight:700;font-size:13px;background:linear-gradient(135deg,var(--yellow),#ffb703);color:#3a2600;border-radius:999px;padding:3px 10px;border:2px solid var(--stroke)}
.stat{display:flex;flex-direction:column;gap:4px}
.stat small{font-family:var(--mono);font-size:10.5px;color:var(--faint);letter-spacing:.08em}

/* speech bubble (VN) */
.bubble{position:relative;background:#fff;color:#221a4d;border:3px solid var(--stroke);border-radius:18px;padding:12px 14px;font-weight:700;font-size:15px;line-height:1.4;box-shadow:0 4px 0 var(--stroke)}
.bubble::after{content:"";position:absolute;left:-14px;top:18px;border:8px solid transparent;border-right-color:#fff;filter:drop-shadow(-3px 0 0 var(--stroke))}
.bubble .who{display:block;font-family:var(--mono);font-size:10.5px;letter-spacing:.1em;color:var(--pink2);margin-bottom:3px;text-transform:uppercase}
.mascot-row{display:flex;gap:12px;align-items:flex-start}
.mascot{width:86px;height:86px;flex:0 0 auto;filter:drop-shadow(0 6px 0 var(--stroke));animation:bob 3s ease-in-out infinite}
.mascot svg{width:100%;height:100%}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}

/* map path */
.chapter{display:flex;align-items:center;justify-content:space-between;gap:8px}
.chapter .nav{width:44px;height:44px;border-radius:14px;border:3px solid var(--stroke);background:var(--panel2);box-shadow:0 4px 0 var(--stroke);display:flex;align-items:center;justify-content:center;font-size:18px}
.chapter .nav:active{transform:translateY(3px);box-shadow:0 1px 0 var(--stroke)}
.path{position:relative;display:grid;grid-template-columns:repeat(5,1fr);gap:14px 8px;padding:14px 4px 6px}
.node{position:relative;aspect-ratio:1;border-radius:50%;border:3px solid var(--stroke);display:flex;align-items:center;justify-content:center;font-family:var(--disp);font-weight:700;font-size:17px;box-shadow:0 5px 0 var(--stroke);background:var(--panel2);color:var(--faint);transition:transform .1s}
.node:active{transform:translateY(3px);box-shadow:0 2px 0 var(--stroke)}
.node.open{background:linear-gradient(180deg,#8ad9ff,#2f9cff);color:#fff}
.node.cur{background:linear-gradient(180deg,#ffe08a,#ffb703);color:#3a2600;animation:pulse 1.6s ease-in-out infinite}
.node.done{background:linear-gradient(180deg,#a3f5b8,#22c55e);color:#063a1a}
.node.lock{opacity:.55}
.node .st{position:absolute;bottom:-10px;left:50%;transform:translateX(-50%);font-size:10px;letter-spacing:-1px;white-space:nowrap;color:var(--yellow);text-shadow:0 1px 0 #000}
.node .lk{position:absolute;top:-6px;right:-6px;font-size:12px}
@keyframes pulse{0%,100%{box-shadow:0 5px 0 var(--stroke),0 0 0 0 #ffd16688}50%{box-shadow:0 5px 0 var(--stroke),0 0 0 10px #ffd16600}}

/* quest list */
.quest{display:flex;align-items:center;gap:12px;padding:12px;border-radius:16px;border:3px solid var(--stroke);background:var(--panel2);box-shadow:0 4px 0 var(--stroke);width:100%;text-align:left}
.quest:active{transform:translateY(3px);box-shadow:0 1px 0 var(--stroke)}
.quest .qi{width:46px;height:46px;border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:22px;border:3px solid var(--stroke);flex:0 0 auto}
.quest b{font-family:var(--disp);font-size:16px}
.quest small{display:block;color:var(--muted);font-size:12.5px;margin-top:2px}
.quest .ok{margin-left:auto;font-size:18px}

/* battle */
.arena{display:flex;flex-direction:column;gap:12px}
.monster{position:relative;display:flex;flex-direction:column;align-items:center;gap:8px;padding:34px 0 4px}
.monster .art{width:150px;height:130px;filter:drop-shadow(0 8px 0 var(--stroke));transition:transform .1s}
.monster.hit .art{animation:shake .35s}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-10px) rotate(-4deg)}40%{transform:translateX(10px) rotate(4deg)}60%{transform:translateX(-6px)}80%{transform:translateX(6px)}}
.monster.dead .art{animation:die .7s forwards}
@keyframes die{to{transform:translateY(30px) scale(.4) rotate(20deg);opacity:0}}
.mname{font-family:var(--disp);font-weight:700;font-size:15px;color:var(--pink)}
.qcard{background:#fff;color:#221a4d;border:3px solid var(--stroke);border-radius:20px;padding:16px;box-shadow:0 6px 0 var(--stroke);text-align:center}
.qcard .kind{font-family:var(--mono);font-size:10.5px;letter-spacing:.12em;color:var(--violet);text-transform:uppercase}
.qcard .q{font-family:var(--disp);font-weight:700;font-size:24px;line-height:1.2;margin-top:6px;letter-spacing:.1px}
.qcard .ipa{font-family:var(--mono);color:#6b5fa8;font-size:13px;margin-top:4px}
.qcard .sub{color:#5b5385;font-size:13.5px;margin-top:6px}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.opt{min-height:60px;padding:10px 12px;border-radius:16px;border:3px solid var(--stroke);background:var(--panel2);color:var(--ink);font-weight:800;font-size:14.5px;line-height:1.25;box-shadow:0 4px 0 var(--stroke);text-align:center}
.opt:active{transform:translateY(3px);box-shadow:0 1px 0 var(--stroke)}
.opt.good{background:linear-gradient(180deg,#a3f5b8,#22c55e);color:#063a1a}
.opt.bad{background:linear-gradient(180deg,#ff9bb8,#ff3b5c);color:#fff}
.opt[disabled]{pointer-events:none}
.combo{position:absolute;right:12px;top:12px;font-family:var(--disp);font-weight:700;color:var(--yellow);font-size:14px;background:#0e0a26cc;border:2px solid var(--stroke);border-radius:999px;padding:3px 10px}
.combo.big{animation:comboPop .4s cubic-bezier(.2,1.6,.4,1)}
@keyframes comboPop{0%{transform:scale(.6)}100%{transform:scale(1)}}
.fx{position:fixed;inset:0;pointer-events:none;z-index:50}
.dmg{position:absolute;font-family:var(--disp);font-weight:700;font-size:28px;color:#fff;text-shadow:0 3px 0 var(--stroke),0 0 14px #ff4f9a;animation:dmgUp .9s ease-out forwards}
.dmg.heal{color:var(--green);text-shadow:0 3px 0 var(--stroke),0 0 14px #22c55e}
@keyframes dmgUp{0%{transform:translateY(0) scale(.7);opacity:0}15%{opacity:1;transform:translateY(-10px) scale(1.15)}100%{transform:translateY(-70px) scale(1);opacity:0}}
.flash{position:fixed;inset:0;background:#ff3b5c;opacity:0;pointer-events:none;z-index:40}
.flash.on{animation:flash .3s}
@keyframes flash{0%{opacity:.35}100%{opacity:0}}
.confetti i{position:absolute;top:-10px;width:9px;height:14px;border-radius:2px;animation:conf linear forwards}
@keyframes conf{to{transform:translateY(110vh) rotate(720deg)}}
.shaking{animation:shake .35s}

/* VN boss */
.vn{position:relative;border-radius:22px;border:3px solid var(--stroke);overflow:hidden;background:linear-gradient(180deg,#2a2160,#141033);box-shadow:0 6px 0 var(--stroke);min-height:300px;display:flex;flex-direction:column}
.vn .scene{position:relative;flex:1;min-height:210px;background:radial-gradient(60% 50% at 50% 60%,#4b3aa8aa,transparent 70%),linear-gradient(180deg,#221a5a,#1a1447)}
.vn .npc{position:absolute;left:50%;bottom:0;transform:translateX(-50%);width:200px;height:200px;filter:drop-shadow(0 6px 0 var(--stroke));transition:transform .2s}
.vn .npc.talk{animation:talk .5s ease-in-out infinite alternate}
@keyframes talk{from{transform:translateX(-50%) translateY(0)}to{transform:translateX(-50%) translateY(-4px)}}
.vn .bosshp{position:absolute;left:12px;right:12px;top:10px}
.vn .box{background:#fff;color:#221a4d;border-top:3px solid var(--stroke);padding:14px 16px 16px;min-height:112px}
.vn .box .name{display:inline-block;font-family:var(--disp);font-weight:700;background:linear-gradient(135deg,var(--pink),var(--violet));color:#fff;border:2px solid var(--stroke);border-radius:999px;padding:2px 12px;font-size:13px;margin-bottom:8px;transform:translateY(-26px);position:absolute}
.vn .box .txt{font-weight:700;font-size:15.5px;line-height:1.45;min-height:44px;margin-top:6px}
.vn .box .txt .cur{display:inline-block;width:8px;height:1em;background:var(--pink2);vertical-align:-2px;animation:blink 1s steps(1) infinite;margin-left:2px}
@keyframes blink{50%{opacity:0}}
.choices{display:flex;flex-direction:column;gap:10px}
.choice{text-align:left;padding:12px 14px;border-radius:16px;border:3px solid var(--stroke);background:var(--panel2);color:var(--ink);font-weight:800;font-size:14.5px;box-shadow:0 4px 0 var(--stroke);line-height:1.3}
.choice:active{transform:translateY(3px);box-shadow:0 1px 0 var(--stroke)}
.choice.good{background:linear-gradient(180deg,#a3f5b8,#22c55e);color:#063a1a}
.choice.bad{background:linear-gradient(180deg,#ff9bb8,#ff3b5c);color:#fff}
.choice[disabled]{pointer-events:none}
.tip{background:#fff7d6;color:#5a3d00;border:3px solid var(--stroke);border-radius:16px;padding:10px 12px;font-weight:700;font-size:13.5px;box-shadow:0 4px 0 var(--stroke)}
.tip .fixl{display:block;margin-top:4px}
.tip s{color:#b0342f}
.tip b.r{color:#0f7a3a}
.input{width:100%;min-height:50px;border-radius:14px;border:3px solid var(--stroke);background:#fff;color:#221a4d;font-size:16px;font-weight:700;padding:0 14px;font-family:var(--sans)}
.input:focus{outline:none;border-color:var(--pink2)}

/* badges */
.badges{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.badge{aspect-ratio:1;border-radius:18px;border:3px solid var(--stroke);background:var(--panel2);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-size:26px;box-shadow:0 4px 0 var(--stroke);text-align:center}
.badge small{font-size:10px;font-family:var(--mono);color:var(--muted);line-height:1.1;padding:0 4px}
.badge.lock{opacity:.35;filter:grayscale(1)}

/* tabs */
.tabs{position:fixed;left:0;right:0;bottom:0;max-width:520px;margin:0 auto;display:flex;gap:6px;padding:10px 12px calc(10px + env(safe-area-inset-bottom));background:#120b2ecc;-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);border-top:3px solid var(--stroke);z-index:20}
.tab{flex:1;background:var(--panel2);border:3px solid var(--stroke);border-radius:16px;padding:8px 4px;display:flex;flex-direction:column;align-items:center;gap:3px;font-family:var(--disp);font-weight:700;font-size:11.5px;color:var(--muted);box-shadow:0 4px 0 var(--stroke)}
.tab span{font-size:20px}
.tab.on{background:linear-gradient(180deg,var(--pink),var(--pink2));color:#fff}
.tab:active{transform:translateY(3px);box-shadow:0 1px 0 var(--stroke)}

/* modal */
.mback{position:fixed;inset:0;background:#0a0620cc;display:flex;align-items:center;justify-content:center;padding:18px;z-index:60;animation:fade .2s}
@keyframes fade{from{opacity:0}to{opacity:1}}
.modal{width:100%;max-width:420px}
.modal .h{font-size:24px}
.big{font-family:var(--disp);font-weight:700;font-size:44px;line-height:1;text-align:center}
.stars3{text-align:center;font-size:40px;letter-spacing:4px;filter:drop-shadow(0 3px 0 #000)}
.toast{position:fixed;left:50%;bottom:110px;transform:translateX(-50%) translateY(20px);background:#fff;color:#221a4d;border:3px solid var(--stroke);border-radius:14px;padding:10px 16px;font-weight:800;font-size:14px;opacity:0;transition:.25s;z-index:70;box-shadow:0 4px 0 var(--stroke);white-space:nowrap;max-width:92vw;text-overflow:ellipsis;overflow:hidden}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.lvup{font-family:var(--disp);font-weight:700;font-size:38px;background:linear-gradient(90deg,var(--yellow),var(--pink),var(--blue));-webkit-background-clip:text;background-clip:text;color:transparent;text-align:center;animation:pop .5s cubic-bezier(.2,1.6,.4,1)}
.kbd{font-family:var(--mono);font-size:12px;background:#0e0a26;border:2px solid var(--line);border-radius:8px;padding:2px 8px;color:var(--mint)}
.skel{height:14px;border-radius:8px;background:linear-gradient(90deg,#2a2160,#3b2f7a,#2a2160);background-size:300% 100%;animation:sh 1.2s infinite linear}
@keyframes sh{to{background-position:-300% 0}}
@media(max-width:380px){.opts{grid-template-columns:1fr}.qcard .q{font-size:21px}}
</style>
</head>
<body>
<div class="stars"></div>
<div class="petals" id="petals"></div>
<div class="shell">
  <header class="top">
    <div class="brand"><span class="ic"><svg viewBox="0 0 100 100"><circle cx="38" cy="46" r="9" fill="#fff"/><circle cx="62" cy="46" r="9" fill="#fff"/><circle cx="40" cy="48" r="4.5" fill="#222"/><circle cx="64" cy="48" r="4.5" fill="#222"/><path d="M38 66q12 10 24 0" stroke="#fff" stroke-width="5" fill="none" stroke-linecap="round"/></svg></span>IT English Quest</div>
    <div class="coins"><i></i><span id="coinN">0</span></div>
  </header>
  <main id="main" style="display:flex;flex-direction:column;gap:14px">
    <div class="card"><div class="skel" style="width:40%"></div><div class="skel" style="width:80%;margin-top:10px"></div><div class="skel" style="height:120px;margin-top:14px"></div></div>
  </main>
  <nav class="tabs" id="tabs"></nav>
</div>
<div class="flash" id="flash"></div>
<div class="fx" id="fx"></div>
<div class="toast" id="toast"></div>
<script src="data.gen.js"></script>
<script src="phrases.gen.js"></script>
<script src="game.js"></script>
</body>
</html>
