<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<title>IT English Quest</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#120b2e">
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20viewBox='0%200%20100%20100'%3E%3Cdefs%3E%3ClinearGradient%20id='g'%20x1='0'%20y1='0'%20x2='1'%20y2='1'%3E%3Cstop%20offset='0'%20stop-color='%23ff7eb6'/%3E%3Cstop%20offset='1'%20stop-color='%237c5cff'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect%20width='100'%20height='100'%20rx='26'%20fill='url(%23g)'/%3E%3Ccircle%20cx='38'%20cy='46'%20r='9'%20fill='%23fff'/%3E%3Ccircle%20cx='62'%20cy='46'%20r='9'%20fill='%23fff'/%3E%3Ccircle%20cx='40'%20cy='48'%20r='4.5'%20fill='%23222'/%3E%3Ccircle%20cx='64'%20cy='48'%20r='4.5'%20fill='%23222'/%3E%3Cpath%20d='M38%2066q12%2010%2024%200'%20stroke='%23fff'%20stroke-width='5'%20fill='none'%20stroke-linecap='round'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@500;700;800&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
:root{
  --bg1:#120b2e; --bg2:#1b1147; --panel:#221a4d; --panel2:#2a2160; --ink:#fff6ff; --muted:#c9bfe8; --faint:#8d83b8;
  --pink:#ff7eb6; --pink2:#ff4f9a; --blue:#5ec8ff; --blue2:#2f9cff; --violet:#a78bfa; --yellow:#ffd166; --mint:#5eead4; --red:#ff5c7a; --green:#7cf29a;
  --line:#3b2f7a; --stroke:#0d0826;
  --disp:'Fredoka','Nunito',system-ui,sans-serif; --sans:'Nunito',system-ui,sans-serif; --mono:'IBM Plex Mono',ui-monospace,monospace;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:var(--sans);color:var(--ink);background:radial-gradient(120% 80% at 20% 0%,#2b1a6a 0%,transparent 55%),radial-gradient(100% 70% at 90% 100%,#4a1650 0%,transparent 55%),linear-gradient(180deg,var(--bg1),var(--bg2));min-height:100%;overflow-x:hidden;-webkit-font-smoothing:antialiased}
button{font-family:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--yellow);outline-offset:2px;border-radius:12px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* stars background */
.stars{position:fixed;inset:0;pointer-events:none;z-index:0;background-image:radial-gradient(1.5px 1.5px at 20% 30%,#fff9 50%,transparent 51%),radial-gradient(1.2px 1.2px at 70% 20%,#fff7 50%,transparent 51%),radial-gradient(1px 1px at 40% 80%,#fff6 50%,transparent 51%),radial-gradient(1.6px 1.6px at 85% 60%,#fff8 50%,transparent 51%),radial-gradient(1px 1px at 10% 70%,#fff5 50%,transparent 51%),radial-gradient(1.3px 1.3px at 55% 50%,#fff6 50%,transparent 51%);background-size:420px 420px;animation:twinkle 6s ease-in-out infinite alternate}
@keyframes twinkle{from{opacity:.55}to{opacity:1}}
.petals{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden}
.petal{position:absolute;top:-5%;width:12px;height:12px;border-radius:12px 0;background:linear-gradient(135deg,#ffb6d5,#ff7eb6);opacity:.8;animation:fall linear infinite}
@keyframes fall{0%{transform:translateY(-10vh) rotate(0) translateX(0)}50%{transform:translateY(50vh) rotate(180deg) translateX(30px)}100%{transform:translateY(110vh) rotate(360deg) translateX(-20px)}}

.shell{position:relative;z-index:1;max-width:520px;margin:0 auto;min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;padding:6px 12px calc(92px + env(safe-area-inset-bottom))}
button,a{touch-action:manipulation;-webkit-tap-highlight-color:transparent}
#main{gap:10px!important}
.top{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:4px 2px 6px}
.brand{display:flex;align-items:center;gap:8px;font-family:var(--disp);font-weight:700;font-size:16px;letter-spacing:.2px}
.brand .ic{width:28px;height:28px;border-radius:11px;background:linear-gradient(135deg,var(--pink),var(--violet));box-shadow:0 4px 0 var(--stroke),0 8px 22px #ff7eb655;display:flex;align-items:center;justify-content:center}
.brand .ic svg{width:22px;height:22px}
.coins{display:inline-flex;align-items:center;gap:6px;background:var(--panel);border:2px solid var(--line);border-radius:999px;padding:6px 12px;font-family:var(--disp);font-weight:700;font-size:14px}
.coins i{width:16px;height:16px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#fff3b0,var(--yellow) 60%,#e0a800);box-shadow:0 0 0 2px #c98d00 inset}

/* panel / sticker style */
.card{background:var(--panel);border:3px solid var(--stroke);border-radius:20px;padding:14px;box-shadow:0 6px 0 var(--stroke),0 14px 30px #0006;position:relative}
.card.pop{animation:pop .35s cubic-bezier(.2,1.4,.4,1) both}
@keyframes pop{from{transform:scale(.92);opacity:0}to{transform:none;opacity:1}}
.h{font-family:var(--disp);font-weight:700;letter-spacing:.2px}
.eyebrow{font-family:var(--mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--pink)}
.muted{color:var(--muted)}
.row{display:flex;align-items:center;gap:10px}
.between{justify-content:space-between}
.grow{flex:1}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:52px;padding:0 20px;border-radius:18px;border:3px solid var(--stroke);
  background:linear-gradient(180deg,var(--pink),var(--pink2));color:#fff;font-family:var(--disp);font-weight:700;font-size:16px;box-shadow:0 5px 0 var(--stroke);transition:transform .08s,box-shadow .08s;text-decoration:none}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 var(--stroke)}
.btn.blue{background:linear-gradient(180deg,var(--blue),var(--blue2))}
.btn.violet{background:linear-gradient(180deg,#b79cff,#7c5cff)}
.btn.yellow{background:linear-gradient(180deg,#ffe08a,#ffb703);color:#3a2600}
.btn.mint{background:linear-gradient(180deg,#8ff5e3,#26c9b0);color:#062f28}
.btn.ghost{background:var(--panel2);color:var(--ink)}
.btn.sm{min-height:42px;padding:0 14px;font-size:14px;border-radius:13px}
.btn.block{width:100%}
.btn[disabled]{opacity:.45;pointer-events:none}

/* bars */
.bar{height:16px;border-radius:999px;background:#0e0a26;border:2px solid var(--stroke);overflow:hidden;position:relative}
.bar>i{display:block;height:100%;border-radius:999px;transition:width .35s cubic-bezier(.2,.8,.2,1)}
.bar.hp>i{background:linear-gradient(90deg,#7cf29a,#22c55e)}
.bar.hp.low>i{background:linear-gradient(90deg,#ff8a8a,#ff3b5c)}
.bar.xp>i{background:linear-gradient(90deg,#8ad9ff,#2f9cff)}
.bar.mon>i{background:linear-gradient(90deg,#ff9bb8,#ff4f9a)}
.bar.time>i{background:linear-gradient(90deg,#ffe08a,#ffb703)}
.bar span{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-family:var(--mono);font-size:10.5px;font-weight:600;color:#fff;text-shadow:0 1px 0 #0008}

/* player card */
.player{display:flex;gap:12px;align-items:center}
.avatar{width:72px;height:72px;border-radius:20px;background:linear-gradient(135deg,#3a2a8a,#5b3aa8);border:3px solid var(--stroke);box-shadow:0 4px 0 var(--stroke);display:flex;align-items:center;justify-content:center;overflow:hidden;flex:0 0 auto}
.avatar svg{width:100%;height:100%}
.lv{display:inline-flex;align-items:center;gap:6px;font-family:var(--disp);font-weight:700;font-size:13px;background:linear-gradient(135deg,var(--yellow),#ffb703);color:#3a2600;border-radius:999px;padding:3px 10px;border:2px solid var(--stroke)}
.stat{display:flex;flex-direction:column;gap:4px}
.stat small{font-family:var(--mono);font-size:10.5px;color:var(--faint);letter-spacing:.08em}

/* speech bubble (VN) */
.bubble{position:relative;background:#fff;color:#221a4d;border:3px solid var(--stroke);border-radius:18px;padding:12px 14px;font-weight:700;font-size:15px;line-height:1.4;box-shadow:0 4px 0 var(--stroke)}
.bubble::after{content:"";position:absolute;left:-14px;top:18px;border:8px solid transparent;border-right-color:#fff;filter:drop-shadow(-3px 0 0 var(--stroke))}
.bubble .who{display:block;font-family:var(--mono);font-size:10.5px;letter-spacing:.1em;color:var(--pink2);margin-bottom:3px;text-transform:uppercase}
.mascot-row{display:flex;gap:12px;align-items:flex-start}
.mascot{width:86px;height:86px;flex:0 0 auto;filter:drop-shadow(0 6px 0 var(--stroke));animation:bob 3s ease-in-out infinite}
.mascot svg{width:100%;height:100%}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}

/* map path */
.chapter{display:flex;align-items:center;justify-content:space-between;gap:8px}
.chapter .nav{width:38px;height:38px;border-radius:12px;border:3px solid var(--stroke);background:var(--panel2);box-shadow:0 4px 0 var(--stroke);display:flex;align-items:center;justify-content:center;font-size:18px}
.chapter .nav:active{transform:translateY(3px);box-shadow:0 1px 0 var(--stroke)}
.path{position:relative;display:grid;grid-template-columns:repeat(5,1fr);gap:12px 6px;padding:12px 2px 8px;justify-items:center}
.node{position:relative;width:50px;height:50px;border-radius:50%;border:3px solid var(--stroke);display:flex;align-items:center;justify-content:center;font-family:var(--disp);font-weight:700;font-size:17px;box-shadow:0 5px 0 var(--stroke);background:var(--panel2);color:var(--faint);transition:transform .1s}
.node:active{transform:translateY(3px);box-shadow:0 2px 0 var(--stroke)}
.node.open{background:linear-gradient(180deg,#8ad9ff,#2f9cff);color:#fff}
.node.cur{background:linear-gradient(180deg,#ffe08a,#ffb703);color:#3a2600;animation:pulse 1.6s ease-in-out infinite}
.node.done{background:linear-gradient(180deg,#a3f5b8,#22c55e);color:#063a1a}
.node.lock{opacity:.55}
.node .st{position:absolute;bottom:-10px;left:50%;transform:translateX(-50%);font-size:10px;letter-spacing:-1px;white-space:nowrap;color:var(--yellow);text-shadow:0 1px 0 #000}
.node .lk{position:absolute;top:-6px;right:-6px;font-size:12px}
@keyframes pulse{0%,100%{box-shadow:0 5px 0 var(--stroke),0 0 0 0 #ffd16688}50%{box-shadow:0 5px 0 var(--stroke),0 0 0 10px #ffd16600}}

/* quest list */
.quest{display:flex;align-items:center;gap:12px;padding:12px;border-radius:16px;border:3px solid var(--stroke);background:var(--panel2);box-shadow:0 4px 0 var(--stroke);width:100%;text-align:left}
.quest:active{transform:translateY(3px);box-shadow:0 1px 0 var(--stroke)}
.quest .qi{width:46px;height:46px;border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:22px;border:3px solid var(--stroke);flex:0 0 auto}
.quest b{font-family:var(--disp);font-size:16px}
.quest small{display:block;color:var(--muted);font-size:12.5px;margin-top:2px}
.quest .ok{margin-left:auto;font-size:18px}

/* battle */
.arena{display:flex;flex-direction:column;gap:12px}
.monster{position:relative;display:flex;flex-direction:column;align-items:center;gap:6px;padding:26px 0 2px}
.monster .art{width:112px;height:98px;filter:drop-shadow(0 8px 0 var(--stroke));transition:transform .1s}
.monster.hit .art{animation:shake .35s}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-10px) rotate(-4deg)}40%{transform:translateX(10px) rotate(4deg)}60%{transform:translateX(-6px)}80%{transform:translateX(6px)}}
.monster.dead .art{animation:die .7s forwards}
@keyframes die{to{transform:translateY(30px) scale(.4) rotate(20deg);opacity:0}}
.mname{font-family:var(--disp);font-weight:700;font-size:15px;color:var(--pink)}
.qcard{background:#fff;color:#221a4d;border:3px solid var(--stroke);border-radius:18px;padding:12px 14px;box-shadow:0 6px 0 var(--stroke);text-align:center}
.qcard .kind{font-family:var(--mono);font-size:10.5px;letter-spacing:.12em;color:var(--violet);text-transform:uppercase}
.qcard .q{font-family:var(--disp);font-weight:700;font-size:22px;line-height:1.2;margin-top:6px;letter-spacing:.1px}
.qcard .ipa{font-family:var(--mono);color:#6b5fa8;font-size:13px;margin-top:4px}
.qcard .sub{color:#5b5385;font-size:13.5px;margin-top:6px}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.opt{min-height:56px;padding:8px 10px;border-radius:16px;border:3px solid var(--stroke);background:var(--panel2);color:var(--ink);font-weight:800;font-size:14.5px;line-height:1.25;box-shadow:0 4px 0 var(--stroke);text-align:center}
.opt:active{transform:translateY(3px);box-shadow:0 1px 0 var(--stroke)}
.opt.good{background:linear-gradient(180deg,#a3f5b8,#22c55e);color:#063a1a}
.opt.bad{background:linear-gradient(180deg,#ff9bb8,#ff3b5c);color:#fff}
.opt[disabled]{pointer-events:none}
.combo{position:absolute;right:12px;top:12px;font-family:var(--disp);font-weight:700;color:var(--yellow);font-size:14px;background:#0e0a26cc;border:2px solid var(--stroke);border-radius:999px;padding:3px 10px}
.combo.big{animation:comboPop .4s cubic-bezier(.2,1.6,.4,1)}
@keyframes comboPop{0%{transform:scale(.6)}100%{transform:scale(1)}}
.fx{position:fixed;inset:0;pointer-events:none;z-index:50}
.dmg{position:absolute;font-family:var(--disp);font-weight:700;font-size:28px;color:#fff;text-shadow:0 3px 0 var(--stroke),0 0 14px #ff4f9a;animation:dmgUp .9s ease-out forwards}
.dmg.heal{color:var(--green);text-shadow:0 3px 0 var(--stroke),0 0 14px #22c55e}
@keyframes dmgUp{0%{transform:translateY(0) scale(.7);opacity:0}15%{opacity:1;transform:translateY(-10px) scale(1.15)}100%{transform:translateY(-70px) scale(1);opacity:0}}
.flash{position:fixed;inset:0;background:#ff3b5c;opacity:0;pointer-events:none;z-index:40}
.flash.on{animation:flash .3s}
@keyframes flash{0%{opacity:.35}100%{opacity:0}}
.confetti i{position:absolute;top:-10px;width:9px;height:14px;border-radius:2px;animation:conf linear forwards}
@keyframes conf{to{transform:translateY(110vh) rotate(720deg)}}
.shaking{animation:shake .35s}

/* VN boss */
.vn{position:relative;border-radius:22px;border:3px solid var(--stroke);overflow:hidden;background:linear-gradient(180deg,#2a2160,#141033);box-shadow:0 6px 0 var(--stroke);min-height:300px;display:flex;flex-direction:column}
.vn .scene{position:relative;flex:1;min-height:210px;background:radial-gradient(60% 50% at 50% 60%,#4b3aa8aa,transparent 70%),linear-gradient(180deg,#221a5a,#1a1447)}
.vn .npc{position:absolute;left:50%;bottom:0;transform:translateX(-50%);width:200px;height:200px;filter:drop-shadow(0 6px 0 var(--stroke));transition:transform .2s}
.vn .npc.talk{animation:talk .5s ease-in-out infinite alternate}
@keyframes talk{from{transform:translateX(-50%) translateY(0)}to{transform:translateX(-50%) translateY(-4px)}}
.vn .bosshp{position:absolute;left:12px;right:12px;top:10px}
.vn .box{background:#fff;color:#221a4d;border-top:3px solid var(--stroke);padding:14px 16px 16px;min-height:112px}
.vn .box .name{display:inline-block;font-family:var(--disp);font-weight:700;background:linear-gradient(135deg,var(--pink),var(--violet));color:#fff;border:2px solid var(--stroke);border-radius:999px;padding:2px 12px;font-size:13px;margin-bottom:8px;transform:translateY(-26px);position:absolute}
.vn .box .txt{font-weight:700;font-size:15.5px;line-height:1.45;min-height:44px;margin-top:6px}
.vn .box .txt .cur{display:inline-block;width:8px;height:1em;background:var(--pink2);vertical-align:-2px;animation:blink 1s steps(1) infinite;margin-left:2px}
@keyframes blink{50%{opacity:0}}
.choices{display:flex;flex-direction:column;gap:10px}
.choice{text-align:left;padding:12px 14px;border-radius:16px;border:3px solid var(--stroke);background:var(--panel2);color:var(--ink);font-weight:800;font-size:14.5px;box-shadow:0 4px 0 var(--stroke);line-height:1.3}
.choice:active{transform:translateY(3px);box-shadow:0 1px 0 var(--stroke)}
.choice.good{background:linear-gradient(180deg,#a3f5b8,#22c55e);color:#063a1a}
.choice.bad{background:linear-gradient(180deg,#ff9bb8,#ff3b5c);color:#fff}
.choice[disabled]{pointer-events:none}
.tip{background:#fff7d6;color:#5a3d00;border:3px solid var(--stroke);border-radius:16px;padding:10px 12px;font-weight:700;font-size:13.5px;box-shadow:0 4px 0 var(--stroke)}
.tip .fixl{display:block;margin-top:4px}
.tip s{color:#b0342f}
.tip b.r{color:#0f7a3a}
.input{width:100%;min-height:50px;border-radius:14px;border:3px solid var(--stroke);background:#fff;color:#221a4d;font-size:16px;font-weight:700;padding:0 14px;font-family:var(--sans)}
.input:focus{outline:none;border-color:var(--pink2)}

/* AFK farm */
.afk{background:linear-gradient(180deg,#2a2160,#1b1147)}
.farm{position:relative;display:flex;align-items:flex-end;justify-content:space-between;height:96px;margin-top:8px;padding:0 10px;background:radial-gradient(60% 40% at 50% 100%,#3b2f7a,transparent 70%);border-radius:14px}
.farm .fm{width:80px;height:80px;animation:bob 2.2s ease-in-out infinite;filter:drop-shadow(0 4px 0 var(--stroke))}
.farm .fb{width:90px;height:78px;animation:wob 1.6s ease-in-out infinite;filter:drop-shadow(0 4px 0 var(--stroke))}
.farm svg{width:100%;height:100%}
@keyframes wob{0%,100%{transform:rotate(-4deg)}50%{transform:rotate(4deg) translateY(-3px)}}
.fx-hit{position:absolute;left:50%;top:26px;transform:translateX(-50%);font-size:26px;opacity:0;filter:drop-shadow(0 2px 0 var(--stroke))}
.fx-hit.go{animation:hitgo .7s ease-out}
@keyframes hitgo{0%{opacity:0;transform:translateX(-50%) scale(.5) rotate(-30deg)}30%{opacity:1;transform:translateX(-10%) scale(1.3) rotate(10deg)}100%{opacity:0;transform:translateX(20%) scale(.8) rotate(30deg)}}
/* daily quests */
.dq{display:flex;align-items:center;gap:10px;padding:10px;border-radius:14px;border:3px solid var(--stroke);background:var(--panel2);box-shadow:0 4px 0 var(--stroke)}
.dq .qi{width:40px;height:40px;border-radius:12px;background:#3b2f7a;border:3px solid var(--stroke);display:flex;align-items:center;justify-content:center;font-size:20px;flex:0 0 auto}
.dq b{font-family:var(--disp);font-size:14px}
.dq small{font-size:11.5px}
.dq.done{border-color:#22c55e}
.bar.mini{height:9px;margin:4px 0}
.bar.mini:not(.hp):not(.xp)>i{background:linear-gradient(90deg,#ffe08a,#ffb703)}
/* shop */
.shopi{display:flex;align-items:center;gap:12px;padding:12px;border-radius:16px;border:3px solid var(--stroke);background:var(--panel2);box-shadow:0 4px 0 var(--stroke)}
.shopi .qi{width:46px;height:46px;border-radius:14px;background:#3b2f7a;border:3px solid var(--stroke);display:flex;align-items:center;justify-content:center;font-size:22px;flex:0 0 auto}
.shopi b{font-family:var(--disp);font-size:15px}
.shopi small{display:block;color:var(--muted);font-size:12.5px;margin-top:2px}

/* talk modes */
.btn.rec{background:linear-gradient(180deg,#ff8a8a,#ff3b5c);animation:recp 1s ease-in-out infinite}
.tip.rec{background:#ffe1e8;color:#8a1030;animation:recp 1s ease-in-out infinite}
@keyframes recp{50%{box-shadow:0 5px 0 var(--stroke),0 0 0 8px #ff3b5c33}}
.wds{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0 8px}
.wd{padding:4px 9px;border-radius:9px;border:2px solid var(--stroke);font-family:var(--mono);font-size:13px;font-weight:600}
.wd.hit{background:#a3f5b8;color:#063a1a}.wd.miss{background:#ff9bb8;color:#5a0d1f;text-decoration:line-through}
.fsay{position:absolute;left:96px;top:6px;right:104px;background:#fff;color:#221a4d;border:2px solid var(--stroke);border-radius:12px;padding:5px 8px;font-size:11.5px;font-weight:800;line-height:1.25;box-shadow:0 3px 0 var(--stroke)}
.eq{display:flex;align-items:center;gap:8px;padding:8px 10px;border-radius:12px;border:2px solid var(--stroke);background:var(--panel2);font-weight:700;font-size:14px}
.vn.linh .scene{background:radial-gradient(60% 50% at 50% 60%,#a8508aaa,transparent 70%),linear-gradient(180deg,#3a1f4d,#1a1447)}
.vn.an .scene{background:radial-gradient(60% 50% at 50% 60%,#2f8f7aaa,transparent 70%),linear-gradient(180deg,#183a3a,#1a1447)}
.nofx .petals,.nofx .stars{display:none}
/* profile (mobile-first) */
.phero{display:flex;flex-direction:column;align-items:center;text-align:center;padding-top:22px}
.avatar.big{width:104px;height:104px;border-radius:30px}
.pname{font-size:24px;margin-top:10px}
.pbars{width:100%;display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px;text-align:left}
.pbars small{display:block;font-family:var(--mono);font-size:10.5px;color:var(--faint);margin-bottom:4px}
.sgroup{display:flex;flex-direction:column;gap:8px}
.slab{font-family:var(--mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--pink);padding:0 6px}
.sbox{background:var(--panel);border:3px solid var(--stroke);border-radius:20px;overflow:hidden;box-shadow:0 5px 0 var(--stroke)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:0;padding:4px}
.stile{padding:10px 6px;text-align:center}
.stile .ic{font-size:20px}.stile .n{font-size:20px}.stile small{color:var(--muted);font-size:11px}
.sbox .badges{padding:12px}
.srow{display:flex;align-items:center;gap:12px;width:100%;min-height:54px;padding:10px 14px;background:none;border:none;border-top:2px solid var(--line);text-align:left;font-size:15px;font-weight:800;color:var(--ink)}
.sbox>.srow:first-child{border-top:none}
.srow .si{width:32px;height:32px;border-radius:10px;background:var(--panel2);border:2px solid var(--stroke);display:flex;align-items:center;justify-content:center;font-size:16px;flex:0 0 auto}
.srow .sl{flex:1}
.srow .sv{color:var(--muted);font-weight:700;font-size:13.5px;max-width:45%;text-align:right;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.srow .sc{color:var(--faint);font-size:20px}
.srow.danger{color:var(--red)}
button.srow:active{background:var(--panel2)}
.sw{width:52px;height:30px;border-radius:999px;border:3px solid var(--stroke);background:#3b2f7a;position:relative;flex:0 0 auto;padding:0;transition:background .18s}
.sw i{position:absolute;top:2px;left:2px;width:20px;height:20px;border-radius:50%;background:#fff;transition:left .18s;box-shadow:0 2px 0 var(--stroke)}
.sw.on{background:linear-gradient(180deg,#8ff5e3,#26c9b0)}.sw.on i{left:24px}
@media(max-width:380px){.stats{grid-template-columns:repeat(3,1fr)}.pbars{grid-template-columns:1fr}}

/* ---- mobile-first map ---- */
.hud{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:16px;background:var(--panel);border:3px solid var(--stroke);box-shadow:0 4px 0 var(--stroke);cursor:pointer}
.avatar.sm{width:46px;height:46px;border-radius:14px}
.mono{font-family:var(--mono);font-size:10.5px;color:var(--faint);letter-spacing:.04em}
.bar.mini{height:9px}
.card.play{padding:14px;background:linear-gradient(180deg,#2a2160,#221a4d)}
.mascot.xs{width:54px;height:54px;animation:none}
.qchips{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:12px}
.qchip{display:flex;flex-direction:column;align-items:center;gap:2px;padding:9px 4px 7px;border-radius:14px;border:3px solid var(--stroke);background:var(--panel2);color:var(--ink);font-weight:800;font-size:11.5px;box-shadow:0 4px 0 var(--stroke);border-top:6px solid var(--c)}
.qchip .ic{font-size:22px;line-height:1}
.qchip small{font-size:10px;color:var(--yellow);letter-spacing:-1px;min-height:12px}
.qchip.done{background:linear-gradient(180deg,#2d5a3a,#1f4a2c)}
.qchip:active{transform:translateY(3px);box-shadow:0 1px 0 var(--stroke)}
.tipline{margin-top:10px;font-size:12.5px;color:var(--muted);font-weight:700}
.strip{display:flex;align-items:center;gap:10px;width:100%;padding:8px 10px;border-radius:16px;border:3px solid var(--stroke);background:var(--panel);box-shadow:0 4px 0 var(--stroke);text-align:left;color:var(--ink)}
.strip .qi{width:40px;height:40px;border-radius:12px;background:var(--panel2);border:3px solid var(--stroke);display:flex;align-items:center;justify-content:center;font-size:20px;flex:0 0 auto}
.strip .sc{color:var(--faint);font-size:20px}
.strip.daily.new{border-color:var(--yellow)}
.strip.daily.new .qi{animation:pulse 1.6s ease-in-out infinite}
.mini-farm{display:flex;align-items:flex-end;gap:2px;width:64px;height:44px;flex:0 0 auto}
.mini-farm svg{width:34px;height:44px}
.mini-farm svg:last-child{width:34px;height:36px;animation:wob 1.6s ease-in-out infinite}
.card.map .path{gap:12px 6px;padding:10px 2px 6px}
.node{font-size:15px}
.node .lk{top:-4px;right:-4px;font-size:11px}
/* pinned action */
.pin{position:sticky;bottom:calc(100px + env(safe-area-inset-bottom));z-index:5;margin-top:10px;box-shadow:0 5px 0 var(--stroke),0 12px 30px #000a}

/* compact battle */
.btop{display:flex;align-items:center;gap:8px;padding:8px 10px}
.ibtn{width:44px;height:44px;border-radius:12px;border:3px solid var(--stroke);background:var(--panel2);box-shadow:0 3px 0 var(--stroke);font-size:16px;line-height:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:0;flex:0 0 auto}
.ibtn b{font-family:var(--mono);font-size:10px;color:var(--yellow)}
.ibtn[disabled]{opacity:.4}
.ibtn:active{transform:translateY(2px);box-shadow:0 1px 0 var(--stroke)}
.moncard{padding:10px 12px;background:linear-gradient(180deg,#2a2160,#1b1147)}
.moncard .monster{flex-direction:row;align-items:center;gap:12px;padding:0}
.moncard .monster .art{width:82px;height:72px;flex:0 0 auto}
.moncard .combo{position:static;font-size:12px;padding:2px 9px}
.moncard .mname{font-size:13.5px}
.infight .tabs{display:none}
.infight .shell{padding-bottom:calc(14px + env(safe-area-inset-bottom))}
.infight .pin{bottom:calc(10px + env(safe-area-inset-bottom))}
.seg{display:flex;gap:6px;margin-top:10px}
.segb{flex:1;min-height:42px;border-radius:12px;border:3px solid var(--stroke);background:var(--panel2);color:var(--muted);font-family:var(--disp);font-weight:700;font-size:13px;box-shadow:0 3px 0 var(--stroke)}
.segb.on{background:linear-gradient(180deg,var(--blue),var(--blue2));color:#fff}

/* AFK mini arena */
.strip.afk{padding:6px 10px;gap:8px}
.am{position:relative;width:132px;height:74px;flex:0 0 auto;border-radius:12px;background:radial-gradient(60% 50% at 50% 100%,#3b2f7a,transparent 72%);overflow:visible}
.am-mochi{position:absolute;left:2px;bottom:2px;width:54px;height:58px}
.am-bug{position:absolute;right:2px;bottom:4px;width:56px;height:50px}
.am svg{width:100%;height:100%;filter:drop-shadow(0 3px 0 var(--stroke))}
.am-bug svg{animation:wob 1.6s ease-in-out infinite}
.am-hp{position:absolute;left:4px;right:4px;top:-8px;height:7px;border-width:2px}
.am-slash{position:absolute;left:58px;bottom:26px;font-size:22px;opacity:0;filter:drop-shadow(0 2px 0 var(--stroke))}
.am.go .am-mochi{animation:lunge .7s cubic-bezier(.2,.8,.2,1)}
.am.go .am-slash{animation:slash .5s .28s ease-out}
.am.go .am-bug svg{animation:bughit .45s .38s,wob 1.6s ease-in-out infinite}
@keyframes lunge{0%{transform:translateX(0)}35%{transform:translateX(22px) rotate(8deg)}55%{transform:translateX(26px) rotate(-6deg)}100%{transform:translateX(0)}}
@keyframes slash{0%{opacity:0;transform:scale(.4) rotate(-40deg)}40%{opacity:1;transform:scale(1.3) rotate(10deg)}100%{opacity:0;transform:scale(.9) rotate(40deg) translateX(10px)}}
@keyframes bughit{0%,100%{transform:translateX(0)}25%{transform:translateX(6px) rotate(6deg)}50%{transform:translateX(-5px) rotate(-5deg)}75%{transform:translateX(4px)}}
.am-bug.dead svg{animation:die .5s forwards}
.am-bug.spawn svg{animation:pop .4s cubic-bezier(.2,1.4,.4,1) both}
.am-fx{position:absolute;inset:0;pointer-events:none}
.am-dmg{position:absolute;top:8px;font-family:var(--disp);font-weight:700;font-size:15px;color:#fff;text-shadow:0 2px 0 var(--stroke),0 0 8px #ff4f9a;animation:dmgUp .8s ease-out forwards}
.am-dmg.coin{color:var(--yellow);text-shadow:0 2px 0 var(--stroke),0 0 8px #ffb703}

/* chat layout for AI talk modes */
#main.chatlay{min-height:calc(100dvh - 60px)}
.vn.compact{min-height:0}
.vn.compact .scene{min-height:140px}
.vn.compact .npc{width:140px;height:140px}
.vn.compact .box{min-height:84px;padding:12px 14px 12px}
.vn.compact .box .txt{font-size:15px;min-height:40px}
.combo.inl{position:static;font-size:12px;padding:2px 9px;flex:0 0 auto}
.tips{display:flex;flex-direction:column;gap:6px}
.tips .tip{font-size:13px;padding:8px 10px}
.tip-more{align-self:flex-end;background:none;border:none;color:var(--blue);font-weight:800;font-size:12.5px;padding:2px 4px}
.talkbar{position:sticky;bottom:calc(8px + env(safe-area-inset-bottom));margin-top:auto;display:flex;gap:8px;align-items:center;padding:8px;border-radius:22px;background:var(--panel);border:3px solid var(--stroke);box-shadow:0 5px 0 var(--stroke),0 12px 30px #000a;z-index:6}
.talkbar .input{min-height:46px;border-width:2px;font-size:15px;border-radius:16px}
.tb-mic,.tb-send{width:48px;height:46px;border-radius:50%;border:3px solid var(--stroke);box-shadow:0 3px 0 var(--stroke);font-size:20px;flex:0 0 auto;display:flex;align-items:center;justify-content:center;padding:0}
.tb-mic{background:linear-gradient(180deg,var(--blue),var(--blue2));color:#fff}
.tb-mic.rec{background:linear-gradient(180deg,#ff8a8a,#ff3b5c);animation:recp 1s ease-in-out infinite}
.tb-send{background:linear-gradient(180deg,var(--pink),var(--pink2));color:#fff}
.tb-mic:active,.tb-send:active{transform:translateY(2px);box-shadow:0 1px 0 var(--stroke)}

/* AFK arena (full card) */
.card.afk2{padding:12px 12px 12px;background:linear-gradient(180deg,#2a2160,#1b1147);cursor:pointer}
.arena2{position:relative;height:98px;margin-top:8px;border-radius:14px;overflow:hidden;background:radial-gradient(70% 60% at 50% 100%,#4a3aa8 0%,#2a2160 55%,transparent 100%),linear-gradient(180deg,#1a1447,#221a4d)}
.arena2 .ground{position:absolute;left:0;right:0;bottom:0;height:22px;background:linear-gradient(180deg,#3b2f7a,#2a2160);border-top:3px solid #0d0826}
.arena2 .ground::after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(90deg,transparent 0 22px,#ffffff10 22px 24px)}
.a-mochi{position:absolute;left:12px;bottom:12px;width:66px;height:72px}
.a-mochi>svg:first-child{width:100%;height:100%;filter:drop-shadow(0 4px 0 var(--stroke))}
.a-mochi .sword{position:absolute;width:18px;height:52px;right:-4px;bottom:18px;transform-origin:50% 92%;transform:rotate(28deg);filter:drop-shadow(0 3px 0 var(--stroke))}
.a-bug{position:absolute;right:14px;bottom:14px;width:66px;height:58px}
.a-bug>svg{width:100%;height:100%;filter:drop-shadow(0 4px 0 var(--stroke));animation:wob 1.6s ease-in-out infinite}
.a-hp{position:absolute;left:6px;right:6px;top:-12px;height:8px;border-width:2px}
.a-slash{position:absolute;right:50px;bottom:22px;width:56px;height:56px;opacity:0;filter:drop-shadow(0 0 6px #ff7eb6)}
.arena2.go .a-mochi{animation:dash 1s cubic-bezier(.3,.9,.3,1)}
.arena2.go .a-mochi .sword{animation:swing 1s ease-in-out}
.arena2.go .a-slash{animation:slash2 .45s .42s ease-out}
.arena2.go .a-bug>svg{animation:bughit .45s .5s,wob 1.6s ease-in-out infinite}
@keyframes dash{0%{transform:translateX(0)}40%{transform:translateX(170px) translateY(-6px)}62%{transform:translateX(178px)}100%{transform:translateX(0)}}
@keyframes swing{0%,30%{transform:rotate(28deg)}45%{transform:rotate(-70deg)}58%{transform:rotate(60deg)}75%,100%{transform:rotate(28deg)}}
@keyframes slash2{0%{opacity:0;transform:scale(.4) rotate(-20deg)}35%{opacity:1;transform:scale(1.15) rotate(0)}100%{opacity:0;transform:scale(1.4) rotate(15deg) translateX(8px)}}
.a-bug.dead>svg{animation:die .5s forwards}
.a-bug.spawn{animation:spawnIn .6s cubic-bezier(.2,1.2,.4,1)}
@keyframes spawnIn{from{transform:translateX(90px)}to{transform:translateX(0)}}
.poof{position:absolute;right:30px;bottom:34px;font-size:34px;opacity:0;pointer-events:none}
.poof.go{animation:poof .6s ease-out}
@keyframes poof{0%{opacity:0;transform:scale(.3)}30%{opacity:1;transform:scale(1.3)}100%{opacity:0;transform:scale(1.8) translateY(-14px)}}
.a-fx{position:absolute;inset:0;pointer-events:none;z-index:3}
.a-fx .am-dmg{top:22px;font-size:17px}
.afk2 .btn.sm{min-height:40px}
/* badges */
.badges{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.badge{aspect-ratio:1;border-radius:18px;border:3px solid var(--stroke);background:var(--panel2);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-size:26px;box-shadow:0 4px 0 var(--stroke);text-align:center}
.badge small{font-size:10px;font-family:var(--mono);color:var(--muted);line-height:1.1;padding:0 4px}
.badge.lock{opacity:.35;filter:grayscale(1)}

/* tabs — floating dock */
.tabs{position:fixed;left:12px;right:12px;bottom:calc(10px + env(safe-area-inset-bottom));max-width:496px;margin:0 auto;display:flex;gap:4px;padding:6px;border-radius:30px;
  background:color-mix(in srgb,#221a4d 88%,transparent);-webkit-backdrop-filter:blur(14px) saturate(1.3);backdrop-filter:blur(14px) saturate(1.3);
  border:2px solid #3b2f7a;box-shadow:0 10px 30px #000a,inset 0 1px 0 #ffffff14;z-index:20}
.tab{flex:1;background:none;border:none;border-radius:24px;padding:6px 4px 7px;display:flex;flex-direction:column;align-items:center;gap:3px;font-family:var(--disp);font-weight:700;font-size:11px;color:var(--faint);box-shadow:none;transition:background .18s,color .18s,transform .12s}
.tab span{font-size:19px;line-height:1;width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;transition:transform .2s cubic-bezier(.2,1.4,.4,1),background .18s}
.tab.on{color:#fff;background:linear-gradient(180deg,var(--pink),var(--pink2));box-shadow:0 6px 16px #ff4f9a66,inset 0 1px 0 #ffffff33}
.tab.on span{background:#ffffff2e;transform:translateY(-1px) scale(1.08)}
.tab:active{transform:scale(.94)}
/* modal */
.mback{position:fixed;inset:0;background:#0a0620cc;display:flex;align-items:flex-end;justify-content:center;padding:0;z-index:60;animation:fade .2s}
.mback .modal{max-width:520px;width:100%;border-radius:24px 24px 0 0;border-bottom:none;box-shadow:0 -6px 30px #0008;padding:14px 16px calc(18px + env(safe-area-inset-bottom));max-height:88vh;max-height:88dvh;overflow:auto;animation:sheet .28s cubic-bezier(.2,.8,.2,1) both}
.mback .modal::before{content:'';display:block;width:44px;height:5px;border-radius:99px;background:var(--line);margin:0 auto 12px}
@keyframes sheet{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}
@media(min-width:620px){.mback{align-items:center;padding:18px}.mback .modal{border-radius:22px;border-bottom:3px solid var(--stroke)}.mback .modal::before{display:none}}
@keyframes fade{from{opacity:0}to{opacity:1}}
.modal{width:100%;max-width:420px}
.modal .h{font-size:24px}
.big{font-family:var(--disp);font-weight:700;font-size:44px;line-height:1;text-align:center}
.stars3{text-align:center;font-size:40px;letter-spacing:4px;filter:drop-shadow(0 3px 0 #000)}
.toast{position:fixed;left:50%;bottom:110px;transform:translateX(-50%) translateY(20px);background:#fff;color:#221a4d;border:3px solid var(--stroke);border-radius:14px;padding:10px 16px;font-weight:800;font-size:14px;opacity:0;transition:.25s;z-index:70;box-shadow:0 4px 0 var(--stroke);white-space:nowrap;max-width:92vw;text-overflow:ellipsis;overflow:hidden}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.lvup{font-family:var(--disp);font-weight:700;font-size:38px;background:linear-gradient(90deg,var(--yellow),var(--pink),var(--blue));-webkit-background-clip:text;background-clip:text;color:transparent;text-align:center;animation:pop .5s cubic-bezier(.2,1.6,.4,1)}
.kbd{font-family:var(--mono);font-size:12px;background:#0e0a26;border:2px solid var(--line);border-radius:8px;padding:2px 8px;color:var(--mint)}
.skel{height:14px;border-radius:8px;background:linear-gradient(90deg,#2a2160,#3b2f7a,#2a2160);background-size:300% 100%;animation:sh 1.2s infinite linear}
@keyframes sh{to{background-position:-300% 0}}
@media(max-width:380px){.opts{grid-template-columns:1fr}.qcard .q{font-size:21px}}
</style>
</head>
