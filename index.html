<title>IT English Basics</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700;12..96,800&family=Hanken+Grotesk:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
:root{
  --bg:#f5f6f8; --surface:#ffffff; --surface2:#f0f2f5;
  --ink:#14161a; --muted:#6b7280; --faint:#9aa1ad;
  --line:#e6e8ec; --line2:#eef0f3;
  --accent:#1b4dff; --accent-ink:#1740d6; --accent-soft:#e9eeff;
  --danger:#c0392b; --danger-soft:#fbeeec;
  --amber:#a66a00; --amber-soft:#f7efdd;
  --disp:'Bricolage Grotesque','Hanken Grotesk',system-ui,sans-serif;
  --sans:'Hanken Grotesk',system-ui,-apple-system,sans-serif;
  --mono:'IBM Plex Mono',ui-monospace,Menlo,monospace;
  --shadow:0 1px 2px rgba(20,30,60,.03),0 12px 30px rgba(20,30,60,.06);
}
:root:not([data-theme="light"]){ @media (prefers-color-scheme:dark){
  --bg:#0e1014; --surface:#171a20; --surface2:#12151b;
  --ink:#eceef2; --muted:#8a909c; --faint:#5f6674;
  --line:#262a31; --line2:#1e222a;
  --accent:#5b7cff; --accent-ink:#8ea6ff; --accent-soft:#182036;
  --danger:#f0857a; --danger-soft:#2a1512;
  --amber:#d8a441; --amber-soft:#2a2210;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 12px 30px rgba(0,0,0,.34);
}}
:root[data-theme="dark"]{
  --bg:#0e1014; --surface:#171a20; --surface2:#12151b;
  --ink:#eceef2; --muted:#8a909c; --faint:#5f6674;
  --line:#262a31; --line2:#1e222a;
  --accent:#5b7cff; --accent-ink:#8ea6ff; --accent-soft:#182036;
  --danger:#f0857a; --danger-soft:#2a1512;
  --amber:#d8a441; --amber-soft:#2a2210;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 12px 30px rgba(0,0,0,.34);
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);
  font-size:16px;line-height:1.55;-webkit-font-smoothing:antialiased}
button{font-family:inherit;cursor:pointer;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:8px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.view>*{animation:rise .4s cubic-bezier(.2,.8,.2,1) both}
.view>*:nth-child(2){animation-delay:.04s}.view>*:nth-child(3){animation-delay:.08s}.view>*:nth-child(4){animation-delay:.12s}

.shell{max-width:480px;margin:0 auto;min-height:100vh;background:var(--bg);
  display:flex;flex-direction:column;position:relative}
@media(min-width:620px){.shell{border-left:1px solid var(--line);border-right:1px solid var(--line)}}

.top{padding:22px 20px 12px;display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand-wrap{display:flex;align-items:center;gap:11px}
.logo{width:40px;height:40px;border-radius:11px;background:var(--accent);display:flex;align-items:center;justify-content:center;flex:0 0 auto;box-shadow:0 6px 14px rgba(27,77,255,.28)}
.logo span{font-family:var(--mono);color:#fff;font-weight:600;font-size:15px;letter-spacing:-.04em}
.brand{display:flex;flex-direction:column;gap:1px}
.brand b{font-family:var(--disp);font-size:18px;font-weight:800;letter-spacing:-.02em;line-height:1}
.brand span{font-size:11.5px;color:var(--muted);font-weight:500}
.top-actions{display:flex;align-items:center;gap:8px}
.streak{display:flex;align-items:center;gap:6px;height:36px;padding:0 12px;border-radius:9px;
  background:var(--surface);border:1px solid var(--line);color:var(--ink);font-family:var(--mono);font-size:14px;font-weight:600}
.streak b{color:var(--accent)}
.icobtn{width:38px;height:38px;border-radius:11px;border:1px solid var(--line);background:var(--surface);
  color:var(--muted);display:flex;align-items:center;justify-content:center;padding:0}
.icobtn:hover{color:var(--ink);border-color:var(--muted)}

.main{flex-grow:1;padding:6px 18px 108px;display:flex;flex-direction:column;gap:18px}
.view{display:flex;flex-direction:column;gap:18px}

.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:18px;
  display:flex;flex-direction:column;gap:14px}
.card.flat{border:none;background:none;padding:0}
.eyebrow{font-family:var(--mono);font-size:11px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--muted)}
.h-sec{font-family:var(--disp);font-size:18px;font-weight:800;margin:0;letter-spacing:-.01em}
.muted{color:var(--muted);font-size:14.5px}
.mono{font-family:var(--mono);font-size:14px;line-height:1.6}

.row{display:flex;align-items:center;gap:10px}
.between{justify-content:space-between}
.wrap{flex-wrap:wrap}
.grow{flex-grow:1}

.chip{display:inline-flex;align-items:center;gap:6px;height:34px;padding:0 13px;border-radius:9px;
  font-size:13px;font-weight:600;background:var(--surface);color:var(--muted);border:1px solid var(--line);white-space:nowrap}
.chip:hover{color:var(--ink)}
.chip.on{background:var(--accent);color:#fff;border-color:var(--accent)}
.chip.err{background:var(--danger-soft);color:var(--danger);border-color:transparent}
.chip.ok{background:var(--accent-soft);color:var(--accent-ink);border-color:transparent}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:52px;padding:0 18px;
  border-radius:12px;border:none;background:var(--accent);color:#fff;font-weight:700;font-size:15px;
  transition:transform .1s ease,filter .15s}
.btn:hover{filter:brightness(1.06)}.btn:active{transform:scale(.98)}
.btn.ghost{background:var(--surface);color:var(--ink);border:1px solid var(--line)}
.btn.ghost:hover{border-color:var(--muted);filter:none}
.btn.accent{background:var(--accent);color:#fff}
.btn.sm{height:42px;font-size:14px;padding:0 14px;border-radius:10px}
.btn.block{width:100%}

.play{width:44px;height:44px;border-radius:11px;border:1px solid var(--line);background:var(--surface);
  color:var(--accent);display:flex;align-items:center;justify-content:center;padding:0;flex:0 0 auto;transition:transform .1s}
.play:hover{background:var(--accent-soft);border-color:var(--accent)}.play:active{transform:scale(.94)}
.play.lg{width:66px;height:66px;border-radius:18px;background:var(--accent);color:#fff;border:none;box-shadow:0 10px 22px rgba(27,77,255,.3)}
.play.lg:hover{filter:brightness(1.06);background:var(--accent)}
.play.speaking{animation:pulse 1s ease-in-out infinite}
@keyframes pulse{50%{transform:scale(1.08)}}

.tabs{position:fixed;bottom:0;left:0;right:0;max-width:480px;margin:0 auto;
  background:var(--surface);border-top:1px solid var(--line);
  display:flex;padding:9px 6px calc(11px + env(safe-area-inset-bottom));z-index:20}
.tab{flex:1;background:none;border:none;padding:6px 2px;display:flex;flex-direction:column;align-items:center;gap:5px;
  color:var(--faint);font-size:10.5px;font-weight:600;border-radius:12px}
.tab.on{color:var(--accent)}
.tab.on b{font-weight:700}
.tab svg{width:21px;height:21px}

.bar{height:8px;border-radius:5px;background:var(--line);overflow:hidden}
.bar>i{display:block;height:100%;border-radius:5px;background:var(--accent);transition:width .5s cubic-bezier(.2,.8,.2,1)}

.flash{min-height:300px;justify-content:center;align-items:stretch;gap:18px;text-align:center}
.term{font-family:var(--disp);font-size:32px;font-weight:800;letter-spacing:-.02em}
.ipa{font-family:var(--mono);color:var(--muted);font-size:15px}
.divider{height:1px;background:var(--line)}
.reveal-hint{color:var(--faint);font-size:13.5px}
.answer{display:flex;flex-direction:column;gap:12px;text-align:left}
.answer .vi{font-family:var(--disp);font-size:20px;font-weight:800;line-height:1.25;letter-spacing:-.01em}
.ex{font-size:15px;line-height:1.55}
.ex .hl{color:var(--accent);font-weight:700}
.ex-vi{color:var(--muted);font-size:13.5px}
.grade{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:9px}
.grade .btn{height:54px;flex-direction:column;gap:2px;font-size:14px;padding:0}
.grade .btn small{font-size:10.5px;font-weight:500;opacity:.7}

.silist{padding:0}
.si{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:15px 4px;
  border:none;border-bottom:1px solid var(--line);width:100%;background:none;text-align:left;color:inherit}
.si:last-child{border-bottom:none}
.si b{font-weight:700;font-size:15px}
.si small{color:var(--muted);font-size:12.5px}
.phrase{display:flex;gap:14px;padding:16px 0;border-bottom:1px solid var(--line)}
.phrase:last-child{border-bottom:none}
.phrase .en{font-size:16px;line-height:1.45;font-weight:600}
.phrase .vi{color:var(--muted);font-size:14px;margin-top:4px}
.phrase .note{color:var(--amber);font-size:12.5px;margin-top:5px}

.bubble{max-width:88%;padding:12px 15px;border-radius:14px;font-size:15px;line-height:1.45}
.bubble.them{background:var(--surface2);border:1px solid var(--line);align-self:flex-start;border-bottom-left-radius:4px}
.bubble.you{background:var(--accent);color:#fff;align-self:flex-end;border-bottom-right-radius:4px}
.who{font-size:11.5px;color:var(--faint);margin:0 6px 5px;font-family:var(--mono)}
.opt{width:100%;text-align:left;padding:15px 16px;border-radius:12px;border:1px solid var(--line);
  background:var(--surface);color:var(--ink);font-size:15px;line-height:1.4}
.opt:hover{border-color:var(--accent)}
.opt.good{border-color:var(--accent);background:var(--accent-soft)}
.opt.bad{border-color:var(--danger);background:var(--danger-soft);color:var(--danger)}
.opt .fb{display:block;margin-top:6px;font-size:12.5px;color:var(--muted)}

.dgap{display:inline-block;min-width:92px;border-bottom:2px solid var(--ink);margin:0 3px;text-align:center}
.dsentence{font-size:19px;line-height:1.8}
.input{width:100%;height:52px;border-radius:12px;border:1px solid var(--line);background:var(--surface);
  color:var(--ink);font-size:16px;padding:0 15px;font-family:var(--sans)}
.input:focus{outline:none;border-color:var(--accent)}
.tokens{display:flex;flex-wrap:wrap;gap:8px}
.tok{font-family:var(--mono);padding:7px 11px;border-radius:7px;font-size:13.5px;font-weight:500;border:1px solid var(--line)}
.tok.hit{background:var(--accent-soft);color:var(--accent-ink);border-color:transparent}
.tok.miss{background:var(--danger-soft);color:var(--danger);border-color:transparent}

.tiles{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px;
  display:flex;flex-direction:column;gap:6px;text-align:left;align-items:stretch;color:inherit}
.tile:hover{border-color:var(--accent)}
.tile .n{font-family:var(--disp);font-size:28px;font-weight:800;letter-spacing:-.02em}
.tile .l{font-size:13px;color:var(--muted)}
.tile .ic{color:var(--accent)}

.empty{text-align:center;color:var(--muted);padding:34px 10px;font-size:14.5px}
.toast{position:fixed;bottom:96px;left:50%;transform:translateX(-50%) translateY(20px);
  background:var(--ink);color:var(--bg);padding:11px 18px;border-radius:10px;font-size:14px;font-weight:600;
  opacity:0;pointer-events:none;transition:.25s;z-index:40;box-shadow:var(--shadow)}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.seg{display:flex;border:1px solid var(--line);border-radius:11px;overflow:hidden;background:var(--surface)}
.seg button{flex:1;height:38px;border:none;border-right:1px solid var(--line);background:none;color:var(--muted);font-size:13px;font-weight:600}
.seg button:last-child{border-right:none}
.seg button.on{background:var(--accent);color:#fff}
</style>
<script src="data.gen.js"></script>
<script src="phrases.gen.js"></script>

<div class="shell">
  <header class="top">
    <div class="brand-wrap">
      <div class="logo"><span>&lt;/&gt;</span></div>
      <div class="brand"><b>IT English</b><span id="sub">Tiếng Anh IT cơ bản</span></div>
    </div>
    <div class="top-actions">
      <div class="streak" title="Chuỗi ngày học">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3c1 4 5 5 5 10a5 5 0 0 1-10 0c0-2 1-3 2-4 0 2 1 3 2 3 0-3-1-6 1-9z"/></svg>
        <b id="streakN">1</b>
      </div>
      <button class="icobtn" id="themeBtn" title="Đổi giao diện" aria-label="Đổi giao diện"></button>
    </div>
  </header>
  <main class="main" id="main"></main>
  <nav class="tabs" id="tabs"></nav>
</div>
<div class="toast" id="toast"></div>

<script>
// ---------- Lesson data: 100-day curriculum (data.gen.js) ----------
const D=window.DATA;
const VOCAB=D.vocab, DIALOGUES=D.dialogues, DICTATION=D.listen, DAYS=D.days;
const SITUATIONS=D.phaseTitles.map((name,i)=>({key:'p'+i,name,note:'Chặng '+(i+1),
  phrases:D.phrases.slice(i*5,i*5+5)}));

// ---------- storage ----------
const KEY="it-english-v1";
function load(){try{return JSON.parse(localStorage.getItem(KEY))||{}}catch(e){return {}}}
function save(s){try{localStorage.setItem(KEY,JSON.stringify(s))}catch(e){}}
let store=load();
if(!store.srs)store.srs={};
if(!store.stats)store.stats={done:0,lastDay:null,streak:1};
if(!store.days)store.days={done:{},cur:1};
// streak calc
(function(){
  const today=new Date().toISOString().slice(0,10);
  const st=store.stats;
  if(st.lastDay!==today){
    const y=new Date(Date.now()-864e5).toISOString().slice(0,10);
    st.streak = st.lastDay===y ? (st.streak||1)+1 : 1;
    st.lastDay=today; save(store);
  }
})();

// ---------- SRS (SM-2 lite) ----------
function due(){
  const now=Date.now();
  return VOCAB.filter(v=>{const c=store.srs[v.t];return !c||c.due<=now;});
}
function grade(term,g){ // g: 0 again,1 hard,2 good,3 easy
  const c=store.srs[term]||{ease:2.3,int:0,reps:0};
  if(g===0){c.reps=0;c.int=0;}
  else{
    c.reps++;
    if(c.reps===1)c.int=1;
    else if(c.reps===2)c.int=3;
    else c.int=Math.round(c.int*c.ease);
    c.ease=Math.max(1.3,c.ease+(g===1?-0.15:g===3?0.15:0));
    if(g===1)c.int=Math.max(1,Math.round(c.int*0.6));
  }
  const days=g===0?0:c.int;
  c.due=Date.now()+days*864e5 + (g===0?60000:0);
  store.srs[term]=c;
  store.stats.done=(store.stats.done||0)+1;
  save(store);markToday('vocab');
}
function learnedCount(){return VOCAB.filter(v=>{const c=store.srs[v.t];return c&&c.reps>=2}).length}

// ---------- speech ----------
let VOICE=null;
function pickVoice(){
  const vs=speechSynthesis.getVoices();
  VOICE=vs.find(v=>/en-US/i.test(v.lang)&&/google|natural|samantha/i.test(v.name))
      ||vs.find(v=>/^en/i.test(v.lang))||null;
}
if('speechSynthesis'in window){pickVoice();speechSynthesis.onvoiceschanged=pickVoice;}
function speak(text,btn){
  if(!('speechSynthesis'in window)){toast("Trình duyệt không hỗ trợ đọc");return;}
  speechSynthesis.cancel();
  const u=new SpeechSynthesisUtterance(text.replace(/<[^>]+>/g,''));
  u.lang="en-US";u.rate=0.95;if(VOICE)u.voice=VOICE;
  if(btn){btn.classList.add('speaking');u.onend=u.onerror=()=>btn.classList.remove('speaking');}
  speechSynthesis.speak(u);
}

// ---------- helpers ----------
const $=s=>document.querySelector(s);
const main=$("#main");
function el(tag,cls,html){const e=document.createElement(tag);if(cls)e.className=cls;if(html!=null)e.innerHTML=html;return e;}
let toastT;
function toast(m){const t=$("#toast");t.textContent=m;t.classList.add('show');clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove('show'),1600);}
const ICO={
  play:'<svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M7 4l13 8-13 8z"/></svg>',
  home:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l9-7 9 7"/><path d="M5 10v10h14V10"/></svg>',
  vocab:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5a2 2 0 0 1 2-2h13v16H6a2 2 0 0 0-2 2z"/><path d="M19 3v18"/></svg>',
  situ:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5h16v10H9l-5 4z"/></svg>',
  talk:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M8 10h8M8 14h5"/><path d="M4 5h16v11H8l-4 3z"/></svg>',
  ear:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6 11a6 6 0 1 1 12 0c0 4-4 4-4 7a3 3 0 0 1-5 2"/><path d="M9 11a3 3 0 0 1 6 0"/></svg>',
  sun:'<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M5 5l1.5 1.5M17.5 17.5L19 19M19 5l-1.5 1.5M6.5 17.5L5 19"/></svg>',
  moon:'<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>',
  chev:'<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="var(--faint)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg>',
  list:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/></svg>',
  copy:'<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15V5h10"/></svg>',
  check:'<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 13l4 4 10-11"/></svg>',
  mic2:'<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0"/><path d="M12 18v3"/></svg>',
  send:'<svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M3 20l18-8L3 4v6l12 2-12 2z"/></svg>',
  micbig:'<svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0"/><path d="M12 18v3"/></svg>',
  bookmark:'<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M6 4h12v16l-6-4-6 4z"/></svg>',
  bookmarkOn:'<svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M6 4h12v16l-6-4-6 4z"/></svg>',
  trash:'<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16M9 7V5h6v2M6 7l1 13h10l1-13"/></svg>'    
};
function playBtn(text){const b=el('button','play');b.innerHTML=ICO.play;b.setAttribute('aria-label','Nghe');b.onclick=()=>speak(text,b);return b;}

// ---------- views ----------
const TABS=[["home","Hôm nay",ICO.home],["phrase","Câu",ICO.list],["vocab","Từ vựng",ICO.vocab],["talk","Giao tiếp",ICO.talk],["listen","Nghe",ICO.ear]];
let cur="home";

function renderTabs(){
  const n=$("#tabs");n.innerHTML="";
  TABS.forEach(([k,label,ic])=>{
    const b=el('button',"tab"+(k===cur?" on":""));

let vMode='card', vTopic='all';

function vTopicPool(){ return vTopic==='all'?VOCAB.slice():VOCAB.slice(vTopic*10,vTopic*10+10); }
function vVocab(){

// ---- Kiểm tra (trắc nghiệm) ----
let qz=[],qzi=0,qzScore=0,qzAns=null;
function vQuizStart(){
  const pool=vTopicPool().slice();
  for(let i=pool.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));const t=pool[i];pool[i]=pool[j];pool[j]=t;}
  qz=pool.slice(0,Math.min(10,pool.length)).map(function(w){
    const dir=Math.random()<0.5?'en2vi':'vi2en';
    const others=VOCAB.filter(function(x){return x.t!==w.t;});
    for(let i=others.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));const t=others[i];others[i]=others[j];others[j]=t;}
    const d3=others.slice(0,3);
    let opts,correct,prompt;
    if(dir==='en2vi'){prompt=w.t;correct=w.vi;opts=[w.vi].concat(d3.map(function(x){return x.vi;}));}
    else{prompt=w.vi;correct=w.t;opts=[w.t].concat(d3.map(function(x){return x.t;}));}
    for(let i=opts.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));const t=opts[i];opts[i]=opts[j];opts[j]=t;}
    return {w:w,dir:dir,prompt:prompt,correct:correct,opts:opts};
  });
  qzi=0;qzScore=0;qzAns=null;drawQuiz();
}
function drawQuiz(){
  main.innerHTML="";const v=el('div','view');
  v.appendChild(vModeBar());v.appendChild(vTopicBar());
  const total=qz.length;
  if(qzi>=total){
    const done=el('div','card');done.style.textAlign='center';done.style.gap='14px';done.style.padding='36px 16px';
    done.innerHTML='<div style="font-size:22px;font-weight:700">'+qzScore+'/'+total+' đúng</div><div class="muted">'+(qzScore===total?'Tuyệt vời!':'Ôn lại từ sai ở tab Thẻ lật nhé.')+'</div>';
    const b=el('button','btn accent block');b.textContent='Làm lại';b.onclick=vQuizStart;done.appendChild(b);
    v.appendChild(done);main.appendChild(v);return;
  }
  const prog=el('div','row between');prog.innerHTML='<span class="muted">Câu '+(qzi+1)+'/'+total+'</span><span class="chip ok" style="height:26px">Đúng '+qzScore+'</span>';v.appendChild(prog);
  const bar=el('div','bar');bar.innerHTML='<i style="width:'+Math.round(qzi/total*100)+'%"></i>';v.appendChild(bar);
  const q=qz[qzi];
  const card=el('div','card');card.style.gap='10px';
  card.appendChild(el('div','eyebrow',q.dir==='en2vi'?'Nghĩa của từ này?':'Từ tiếng Anh?'));
  const prow=el('div','row');prow.style.gap='10px';
  const pr=el('div');pr.style.cssText=q.dir==='en2vi'?'font-size:26px;font-weight:700':'font-size:19px;font-weight:600';pr.textContent=q.prompt;
  prow.appendChild(pr);
  if(q.dir==='en2vi'){const pb=el('button','play');pb.innerHTML=ICO.play;pb.setAttribute('aria-label','Nghe');pb.onclick=function(){speak(q.w.t,pb);};prow.appendChild(pb);}
  card.appendChild(prow);v.appendChild(card);
  const ow=el('div');ow.style.cssText='display:flex;flex-direction:column;gap:10px';
  q.opts.forEach(function(o){
    const btn=el('button','opt',o);
    if(qzAns!=null){
      btn.disabled=true;
      if(o===q.correct)btn.classList.add('good');
      else if(o===qzAns)btn.classList.add('bad');
    }else{
      btn.onclick=function(){qzAns=o;const ok=(o===q.correct);if(ok)qzScore++;grade(q.w.t,ok?2:0);drawQuiz();speak(q.w.t);};
    }
    ow.appendChild(btn);
  });
  v.appendChild(ow);
  if(qzAns!=null){
    const nx=el('button','btn accent block');nx.textContent=qzi<total-1?'Câu tiếp':'Xem kết quả';
    nx.onclick=function(){qzi++;qzAns=null;drawQuiz();};v.appendChild(nx);
  }
  main.appendChild(v);
}

async function aiStart(){

  if(!sp){toast('Mở app trong Claude để trò chuyện AI');aiScenario=null;vTalkAI();return;}

    const r=await sp([{role:'user',content:aiRules(aiScObj().s)+" Start the conversation now with your first line."}],
      {modelTier:'quick',cache:false,onText:function(u){aiPending=u.text;const el2=document.getElementById('aiLive');if(el2)el2.textContent=aiParse(u.text).reply;}});
    aiTurns.push({role:'assistant',content:r.text});
  }catch(e){toast('Lỗi AI, thử lại');}

}
async function aiSend(){
  const inp=$("#aiInput");if(!inp||aiBusy)return;const text=inp.value.trim();if(!text)return;
  const sp=await aiInit();if(!sp){toast('Cần mở trong Claude');return;}
  aiTurns.push({role:'user',content:text});aiBusy=true;aiPending='';vTalkAI();
  const msgs=[{role:'user',content:aiRules(aiScObj().s)}].concat(aiTurns);
  try{
    const r=await sp(msgs,{modelTier:'quick',cache:false,onText:function(u){aiPending=u.text;const el2=document.getElementById('aiLive');if(el2)el2.textContent=aiParse(u.text).reply;}});
    aiTurns.push({role:'assistant',content:r.text});store.stats.done=(store.stats.done||0)+1;save(store);markToday('talk');
  }catch(e){aiTurns.push({role:'assistant',content:'(Lỗi mạng, thử lại)\nFIX: OK'});}

// LISTEN — chép chính tả + nhại theo (shadowing)
let lMode='dictation', lIdx=0, lChecked=false, lHeard='';
function lSentence(){return DICTATION[lIdx].s.join(' ');}
function lNorm(w){return w.toLowerCase().replace(/[^a-z']/g,'');}

function lModeBar(){
  const seg=el('div','seg');

    const btn=el('button',lMode===m[0]?'on':'');btn.textContent=m[1];btn.onclick=function(){lMode=m[0];lChecked=false;lHeard='';vListen();};seg.appendChild(btn);
  });

function lPlayer(full){
  const player=el('div','card');player.style.alignItems='center';player.style.gap='14px';
  const big=el('button','play lg');big.innerHTML=ICO.play;big.setAttribute('aria-label','Nghe câu');big.onclick=function(){speak(full,big);};

  });

  return player;
}
function lDiff(){
  const said=(lHeard||'').split(/\s+/).map(lNorm).filter(Boolean);
  return DICTATION[lIdx].s.map(function(tw){
    const n=lNorm(tw); if(!n)return {w:tw,hit:true};
    const k=said.indexOf(n); if(k>=0){said.splice(k,1);return {w:tw,hit:true};} return {w:tw,hit:false};
  });
}
function lTokens(diff){
  const toks=el('div','tokens');
  diff.forEach(function(d){toks.appendChild(el('span','tok '+(d.hit?'hit':'miss'),d.w));});

}

      const chk=el('button','btn accent block');chk.textContent='Kiểm tra';chk.onclick=lCheckDict;card.appendChild(chk);
    }else{
      const diff=lDiff();const hit=diff.filter(function(d){return d.hit;}).length;
      card.appendChild(el('div','eyebrow','Đối chiếu · đúng '+hit+'/'+diff.length+' từ'));
      card.appendChild(lTokens(diff));
      card.appendChild(el('div','muted','Chỗ đỏ là từ bạn nghe sót hoặc gõ sai.'));
    }
    v.appendChild(card);
  }else{
    const card=el('div','card');
    card.appendChild(el('div','eyebrow','Câu mẫu'));
    const txt=el('div');txt.style.cssText='font-size:18px;line-height:1.5';txt.textContent=full;card.appendChild(txt);
    if(lChecked){
      const diff=lDiff();const hit=diff.filter(function(d){return d.hit;}).length;
      const pct=Math.round(hit/diff.length*100);
      const sc=pct>=80?'var(--accent-ink)':(pct>=50?'var(--amber)':'var(--danger)');
      const scRow=el('div','row between');
      scRow.innerHTML='<span class="eyebrow">Điểm phát âm</span><span style="font-weight:700;font-size:20px;color:'+sc+'">'+pct+'%</span>';
      card.appendChild(scRow);
      card.appendChild(lTokens(diff));
      const missed=diff.filter(function(d){return !d.hit;}).map(function(d){return d.w;});
      if(missed.length){
        const tip=el('button','btn ghost sm');tip.style.alignSelf='flex-start';tip.textContent='Mẹo phát âm (AI)';
        tip.onclick=async function(){
          const sp=await aiInit();if(!sp){toast('Cần mở trong Claude');return;}
          tip.disabled=true;tip.textContent='Đang nghĩ…';
          try{const r=await sp('Give ONE short practical Vietnamese tip to pronounce these English words better: '+missed.join(', ')+'. Under 35 words.',{modelTier:'quick'});
            const t=el('div','muted');t.style.marginTop='6px';t.textContent=r.text.trim();card.appendChild(t);tip.remove();}
          catch(e){toast('Lỗi, thử lại');tip.disabled=false;tip.textContent='Mẹo phát âm (AI)';}
        };
        card.appendChild(tip);
      }
    }else{
      card.appendChild(el('div','muted','Nghe câu mẫu, rồi bấm mic và nói nhại lại.'));
    }
    v.appendChild(card);
    const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
    const micRow=el('div');micRow.style.cssText='display:flex;flex-direction:column;align-items:center;gap:10px';
    if(SR){
      const mic=el('button','play lg');mic.style.background='var(--danger)';mic.style.color='#fff';mic.innerHTML=ICO.micbig;mic.setAttribute('aria-label','Nói nhại');mic.onclick=lShadow;
      micRow.appendChild(mic);micRow.appendChild(el('div','muted','Bấm rồi nói nhại theo'));
    }else{
      micRow.appendChild(el('div','muted','Trình duyệt không hỗ trợ mic — hãy nói nhẩm theo câu mẫu.'));
    }
    v.appendChild(micRow);
  }

  const nav=el('div','row');nav.style.gap='10px';
  if(lChecked){const rp=el('button','btn ghost sm');rp.innerHTML=ICO.play+' Nghe lại';rp.onclick=function(){speak(full,rp);};nav.appendChild(rp);}
  const nx=el('button','btn accent grow');nx.textContent='Câu tiếp ›';nx.onclick=function(){store.stats.done=(store.stats.done||0)+1;save(store);lNext();};nav.appendChild(nx);
  v.appendChild(nav);
  main.appendChild(v);
  if(lMode==='dictation'&&!lChecked)setTimeout(function(){const i=$("#dInput");if(i)i.focus();},40);
}
function lCheckDict(){const i=$("#dInput");lHeard=i?i.value:'';lChecked=true;markToday('listen');vListen();}
function lShadow(){
  const SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(!SR){toast('Không hỗ trợ mic');return;}
  const r=new SR();r.lang='en-US';r.interimResults=false;
  r.onresult=function(e){lHeard=e.results[0][0].transcript;lChecked=true;markToday('listen');vListen();};
  r.onerror=function(){toast('Không nghe được, thử lại');};
  try{r.start();toast('Đang nghe… nói nhại câu mẫu');}catch(e){}
}

// PHRASE = Câu thường dùng (1000 câu)
const PHRASES=window.PHRASES||[];
let pcGroup=0, pcQuery="";
function copyText(t,btn){
  const ok=()=>{if(btn){const o=btn.innerHTML;btn.innerHTML=ICO.check;setTimeout(()=>btn.innerHTML=o,900);}toast("Đã copy");};
  const fb=()=>{const ta=document.createElement('textarea');ta.value=t;ta.style.position='fixed';ta.style.opacity='0';document.body.appendChild(ta);ta.select();try{document.execCommand('copy');ok();}catch(_){}ta.remove();};
  try{if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(t).then(ok,fb);else fb();}catch(e){fb();}
}
function phraseRow(en,vi,gname){
  const row=el('div','phrase');
  const tx=el('div','grow');
  tx.innerHTML=`<div class="en">${en}</div><div class="vi">${vi}</div>${gname?`<div class="note" style="color:var(--faint)">${gname}</div>`:''}`;
  const btns=el('div');btns.style.cssText="display:flex;flex-direction:column;gap:6px;flex:0 0 auto";
  btns.appendChild(playBtn(en));
  const cp=el('button','play');cp.innerHTML=ICO.copy;cp.setAttribute('aria-label','Copy');
  cp.style.cssText="width:40px;height:40px;color:var(--muted)";cp.onclick=()=>copyText(en,cp);
  btns.appendChild(cp);
  row.appendChild(tx);row.appendChild(btns);
  return row;
}
function vPhrase(){
  main.innerHTML="";const v=el('div','view');
  const rl=el('div','card');rl.style.gap="12px";
  rl.appendChild(el('div','eyebrow','Luyện random — chọn số câu'));
  const rr=el('div','row wrap');
  [10,20,30,50].forEach(function(n){const c=el('button','chip'+(rnCount===n?' on':''),n+' câu');c.onclick=function(){rnCount=n;vPhrase();};rr.appendChild(c);});
  rl.appendChild(rr);
  const rb=el('button','btn accent block');rb.textContent='Bắt đầu '+rnCount+' câu ngẫu nhiên';rb.onclick=function(){startRandom(rnCount);};
  rl.appendChild(rb);
  v.appendChild(rl);
  const sb=el('div','card flat');sb.style.padding="0";sb.style.gap="10px";
  const inp=el('input','input');inp.id="pcSearch";inp.placeholder="Tìm câu (tiếng Anh hoặc tiếng Việt)…";inp.value=pcQuery;inp.autocomplete="off";
  inp.oninput=()=>{pcQuery=inp.value.trim();paint();};
  sb.appendChild(inp);
  const chips=el('div');chips.style.cssText="display:flex;gap:8px;overflow-x:auto;padding-bottom:2px";
  const mk=(label,active,fn)=>{const c=el('button','chip'+(active?' on':''),label);c.style.flex="0 0 auto";c.onclick=fn;return c;};
  const rebuild=()=>{chips.innerHTML="";
    chips.appendChild(mk("Tất cả",!pcQuery&&pcGroup==='all',()=>{pcGroup='all';pcQuery='';inp.value='';paint();rebuild();}));
    const nSaved=(store.saved||[]).length;
    chips.appendChild(mk("★ Đã lưu"+(nSaved?(" ("+nSaved+")"):""),!pcQuery&&pcGroup==='saved',()=>{pcGroup='saved';pcQuery='';inp.value='';paint();rebuild();}));
    PHRASES.forEach((g,i)=>chips.appendChild(mk(g.name,!pcQuery&&pcGroup===i,()=>{pcGroup=i;pcQuery='';inp.value='';paint();rebuild();})));};
  rebuild();sb.appendChild(chips);v.appendChild(sb);
  const list=el('div','card');list.id="pcList";v.appendChild(list);
  main.appendChild(v);
  function paint(){const L=$("#pcList");L.innerHTML="";let rows=[];
    if(!pcQuery&&pcGroup==='saved'){
      const items=store.saved||[];
      L.appendChild(el('div','eyebrow','Đã lưu · '+items.length+' câu'));
      if(!items.length){L.appendChild(el('div','empty','Chưa lưu câu nào. Vào Giao tiếp, bấm dấu lưu ở câu để thêm vào đây.'));return;}
      items.forEach(function(it){
        const rowx=el('div','phrase');const tx=el('div','grow');
        tx.innerHTML='<div class="en">'+it.en+'</div>'+(it.note?'<div class="note">'+it.note+'</div>':'');
        const btns=el('div');btns.style.cssText='display:flex;flex-direction:column;gap:6px;flex:0 0 auto';
        btns.appendChild(playBtn(it.en));
        const rm=el('button','play');rm.style.cssText='width:40px;height:40px;color:var(--danger)';rm.innerHTML=ICO.trash;rm.setAttribute('aria-label','Bỏ lưu');rm.onclick=function(){toggleSaved(it.en);paint();rebuild();};
        btns.appendChild(rm);
        rowx.appendChild(tx);rowx.appendChild(btns);L.appendChild(rowx);
      });
      return;
    }
    if(pcQuery){const q=pcQuery.toLowerCase();
      PHRASES.forEach(g=>g.items.forEach(it=>{if(it.en.toLowerCase().includes(q)||it.vi.toLowerCase().includes(q))rows.push([it.en,it.vi,g.name]);}));
      L.appendChild(el('div','eyebrow',rows.length+' câu khớp'));
    }else if(pcGroup==='all'){
      PHRASES.forEach(g=>g.items.forEach(it=>rows.push([it.en,it.vi,g.name])));
      L.appendChild(el('div','eyebrow','Tất cả · '+rows.length+' câu'));
    }else{const g=PHRASES[pcGroup];L.appendChild(el('div','eyebrow',g.name+' · '+g.items.length+' câu'));
      g.items.forEach(it=>rows.push([it.en,it.vi,null]));}
    if(!rows.length){L.appendChild(el('div','empty','Không tìm thấy câu nào.'));return;}
    rows.slice(0,pcQuery?400:1200).forEach(r=>L.appendChild(phraseRow(r[0],r[1],r[2])));
  }
  paint();
}

// RANDOM practice over the 1000 phrases
let rnCount=20, rnQueue=[], rnIdx=0, rnShow=false;
function startRandom(n){
  const all=[];PHRASES.forEach(function(g){g.items.forEach(function(it){all.push({en:it.en,vi:it.vi,g:g.name});});});
  for(let i=all.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));const tmp=all[i];all[i]=all[j];all[j]=tmp;}
  rnQueue=all.slice(0,n);rnIdx=0;rnShow=false;markToday('phrases');drawRandom();
}
function drawRandom(){
  main.innerHTML="";const v=el('div','view');
  const back=el('button','btn ghost sm');back.style.alignSelf="flex-start";back.textContent="‹ Câu thường dùng";back.onclick=vPhrase;v.appendChild(back);
  const total=rnQueue.length;
  if(rnIdx>=total){
    const done=el('div','card');done.style.textAlign="center";done.style.gap="14px";done.style.padding="38px 18px";
    done.innerHTML='<div style="font-size:21px;font-weight:700">Xong '+total+' câu 🎉</div><div class="muted">Làm bộ mới để luyện tiếp.</div>';
    const again=el('button','btn accent block');again.textContent='Luyện '+total+' câu khác';again.onclick=function(){startRandom(total);};done.appendChild(again);
    v.appendChild(done);main.appendChild(v);return;
  }
  const prog=el('div','row between');prog.innerHTML='<span class="muted">Câu '+(rnIdx+1)+' / '+total+'</span><span class="chip" style="height:26px">Ngẫu nhiên</span>';v.appendChild(prog);
  const bar=el('div','bar');bar.innerHTML='<i style="width:'+Math.round(rnIdx/total*100)+'%"></i>';v.appendChild(bar);
  const it=rnQueue[rnIdx];
  const c=el('div','card flash');c.style.minHeight="240px";
  const top=el('div');top.style.cssText="display:flex;flex-direction:column;gap:16px;align-items:center";
  top.innerHTML='<div class="eyebrow">'+it.g+'</div><div style="font-size:22px;font-weight:600;line-height:1.4">'+it.en+'</div>';
  const pb=el('button','play');pb.innerHTML=ICO.play;pb.setAttribute('aria-label','Nghe');pb.onclick=function(e){e.stopPropagation();speak(it.en,pb);};top.appendChild(pb);
  c.appendChild(top);
  if(!rnShow){const h=el('div','reveal-hint','Chạm để xem nghĩa');c.appendChild(h);c.style.cursor="pointer";c.onclick=function(){rnShow=true;drawRandom();speak(it.en);};}
  else{c.appendChild(el('div','divider'));const a=el('div','answer');a.innerHTML='<div class="vi">'+it.vi+'</div>';c.appendChild(a);}
  v.appendChild(c);
  if(rnShow){const nx=el('button','btn accent block');nx.textContent=(rnIdx<total-1?'Câu tiếp':'Xong');
    nx.onclick=function(){rnIdx++;rnShow=false;store.stats.done=(store.stats.done||0)+1;save(store);drawRandom();};v.appendChild(nx);}
  main.appendChild(v);window.scrollTo(0,0);
}

// ---------- theme ----------
function curTheme(){return document.documentElement.getAttribute('data-theme')
  || (matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light');}
function setThemeBtn(){$("#themeBtn").innerHTML=curTheme()==='dark'?ICO.sun:ICO.moon;}
$("#themeBtn").onclick=()=>{const next=curTheme()==='dark'?'light':'dark';
  document.documentElement.setAttribute('data-theme',next);setThemeBtn();try{store.theme=next;save(store)}catch(e){}};
if(store.theme)document.documentElement.setAttribute('data-theme',store.theme);
setThemeBtn();

// ---------- boot ----------
$("#streakN").textContent=store.stats.streak||1;
renderTabs();vHome();
</script>
