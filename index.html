<meta charset="utf-8">
<title>IT English Basics</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1b4dff">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="IT English">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700;12..96,800&family=Hanken+Grotesk:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
:root{
  --bg:#f5f6f8; --surface:#ffffff; --surface2:#f0f2f5;
  --ink:#14161a; --muted:#6b7280; --faint:#9aa1ad;
  --line:#e6e8ec; --line2:#eef0f3;
  --accent:#1b4dff; --accent-ink:#1740d6; --accent-soft:#e9eeff;
  --danger:#c0392b; --danger-soft:#fbeeec;
  --amber:#a66a00; --amber-soft:#f7efdd;
  --disp:'Bricolage Grotesque','Hanken Grotesk',system-ui,sans-serif;
  --sans:'Hanken Grotesk',system-ui,-apple-system,sans-serif;
  --mono:'IBM Plex Mono',ui-monospace,Menlo,monospace;
  --shadow:0 1px 2px rgba(20,30,60,.03),0 12px 30px rgba(20,30,60,.06);
}
:root:not([data-theme="light"]){ @media (prefers-color-scheme:dark){
  --bg:#0e1014; --surface:#171a20; --surface2:#12151b;
  --ink:#eceef2; --muted:#8a909c; --faint:#5f6674;
  --line:#262a31; --line2:#1e222a;
  --accent:#5b7cff; --accent-ink:#8ea6ff; --accent-soft:#182036;
  --danger:#f0857a; --danger-soft:#2a1512;
  --amber:#d8a441; --amber-soft:#2a2210;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 12px 30px rgba(0,0,0,.34);
}}
:root[data-theme="dark"]{
  --bg:#0e1014; --surface:#171a20; --surface2:#12151b;
  --ink:#eceef2; --muted:#8a909c; --faint:#5f6674;
  --line:#262a31; --line2:#1e222a;
  --accent:#5b7cff; --accent-ink:#8ea6ff; --accent-soft:#182036;
  --danger:#f0857a; --danger-soft:#2a1512;
  --amber:#d8a441; --amber-soft:#2a2210;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 12px 30px rgba(0,0,0,.34);
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);
  font-size:16px;line-height:1.55;-webkit-font-smoothing:antialiased}
button{font-family:inherit;cursor:pointer;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:8px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.view>*{animation:rise .4s cubic-bezier(.2,.8,.2,1) both}
.view>*:nth-child(2){animation-delay:.04s}.view>*:nth-child(3){animation-delay:.08s}.view>*:nth-child(4){animation-delay:.12s}
/* Stack: layout như .view nhưng KHÔNG chạy lại hiệu ứng mỗi lần render (tránh giật khi sang thẻ mới) */
.stack{display:flex;flex-direction:column;gap:18px}
/* Hiệu ứng riêng cho thẻ: trượt vào từ góc dưới-trái + hơi xoay (kiểu thả/lật thẻ) */
@keyframes cardIn{from{opacity:0;transform:translate(-16px,18px) scale(.965) rotate(-1.4deg)}to{opacity:1;transform:none}}
.cardIn{animation:cardIn .34s cubic-bezier(.2,.8,.2,1) both;will-change:transform,opacity}
/* Popup / modal nổi giữa màn hình */
.modal-back{position:fixed;inset:0;background:rgba(10,14,25,.55);display:flex;align-items:center;justify-content:center;padding:20px;z-index:60;animation:mfade .16s ease both}
@keyframes mfade{from{opacity:0}to{opacity:1}}
.modal{width:100%;max-width:420px;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:20px;display:flex;flex-direction:column;gap:14px;box-shadow:0 20px 60px rgba(0,0,0,.35);animation:mpop .22s cubic-bezier(.2,.8,.2,1) both}
@keyframes mpop{from{opacity:0;transform:translateY(14px) scale(.96)}to{opacity:1;transform:none}}
.modal h3{margin:0;font-family:var(--disp);font-size:19px;font-weight:800;letter-spacing:-.01em}
/* Bottom-sheet trên điện thoại */
@media(max-width:619px){
  .modal-back{align-items:flex-end;padding:0}
  .modal{max-width:none;border-radius:20px 20px 0 0;padding-bottom:calc(20px + env(safe-area-inset-bottom));animation:msheet .26s cubic-bezier(.2,.8,.2,1) both}
}
@keyframes msheet{from{transform:translateY(100%)}to{transform:none}}
/* Lật thẻ 3D khi xem nghĩa */
@keyframes flipReveal{from{transform:perspective(900px) rotateY(-90deg);opacity:0}60%{opacity:1}to{transform:none;opacity:1}}
.flipReveal{animation:flipReveal .42s cubic-bezier(.2,.8,.2,1) both;transform-origin:center}
/* Lớp phủ khi vuốt thẻ */
.swipe-badge{position:absolute;top:14px;padding:7px 13px;border-radius:999px;font-weight:700;font-size:13px;opacity:0;pointer-events:none;z-index:3}
.swipe-badge.l{left:14px;background:var(--danger-soft);color:var(--danger);transform:rotate(-7deg)}
.swipe-badge.r{right:14px;background:var(--accent-soft);color:var(--accent-ink);transform:rotate(7deg)}
/* Vòng tiến độ */
.ring-wrap{position:relative;width:76px;height:76px;flex:0 0 auto}
.ring-wrap svg{transform:rotate(-90deg)}
.ring-wrap .rc{fill:none;stroke:var(--line);stroke-width:8}
.ring-wrap .rp{fill:none;stroke:var(--accent);stroke-width:8;stroke-linecap:round;transition:stroke-dashoffset .6s cubic-bezier(.2,.8,.2,1)}
.ring-wrap .rt{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;font-family:var(--disp);font-weight:800;font-size:18px;line-height:1}
.ring-wrap .rt small{font-size:9.5px;color:var(--muted);font-weight:600;font-family:var(--mono)}
/* Chấm "đang gõ…" */
.typing{display:inline-flex;gap:5px;align-items:center;padding:14px 16px}
.typing i{width:7px;height:7px;border-radius:50%;background:var(--faint);animation:tdot 1s infinite}
.typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}
@keyframes tdot{0%,60%,100%{opacity:.3;transform:translateY(0)}30%{opacity:1;transform:translateY(-4px)}}
/* Toast màu */
.toast.ok{background:var(--accent);color:#fff}
.toast.err{background:var(--danger);color:#fff}
/* Skeleton loading */
.skel{background:linear-gradient(90deg,var(--surface2) 25%,var(--line) 37%,var(--surface2) 63%);background-size:400% 100%;animation:shimmer 1.3s infinite linear;border-radius:8px}
@keyframes shimmer{from{background-position:100% 0}to{background-position:-100% 0}}
/* Mic đang nghe */
.play.listening{background:var(--danger)!important;color:#fff!important;border:none;animation:pulse 1s ease-in-out infinite}

.shell{max-width:480px;margin:0 auto;min-height:100vh;background:var(--bg);
  display:flex;flex-direction:column;position:relative}
@media(min-width:620px){.shell{border-left:1px solid var(--line);border-right:1px solid var(--line)}}

.top{padding:22px 20px 12px;display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand-wrap{display:flex;align-items:center;gap:11px}
.logo{width:40px;height:40px;border-radius:11px;position:relative;overflow:hidden;background:linear-gradient(140deg,#4f7bff,#1234d8);display:flex;align-items:center;justify-content:center;flex:0 0 auto;box-shadow:0 6px 14px rgba(27,77,255,.3)}
.logo::after{content:"";position:absolute;inset:0;background:radial-gradient(120% 90% at 30% 12%,rgba(255,255,255,.35),rgba(255,255,255,0) 55%)}
.logo svg{position:relative;z-index:1;width:26px;height:26px}
.brand{display:flex;flex-direction:column;gap:1px}
.brand b{font-family:var(--disp);font-size:18px;font-weight:800;letter-spacing:-.02em;line-height:1}
.brand span{font-size:11.5px;color:var(--muted);font-weight:500}
.top-actions{display:flex;align-items:center;gap:8px}
.streak{display:flex;align-items:center;gap:6px;height:36px;padding:0 12px;border-radius:9px;
  background:var(--surface);border:1px solid var(--line);color:var(--ink);font-family:var(--mono);font-size:14px;font-weight:600}
.streak b{color:var(--accent)}
.icobtn{width:38px;height:38px;border-radius:11px;border:1px solid var(--line);background:var(--surface);
  color:var(--muted);display:flex;align-items:center;justify-content:center;padding:0}
.icobtn:hover{color:var(--ink);border-color:var(--muted)}

.main{flex-grow:1;padding:6px 18px 108px;display:flex;flex-direction:column;gap:18px}
.view{display:flex;flex-direction:column;gap:18px}

.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:18px;
  display:flex;flex-direction:column;gap:14px}
.card.flat{border:none;background:none;padding:0}
.eyebrow{font-family:var(--mono);font-size:11px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--muted)}
.h-sec{font-family:var(--disp);font-size:18px;font-weight:800;margin:0;letter-spacing:-.01em}
.muted{color:var(--muted);font-size:14.5px}
.mono{font-family:var(--mono);font-size:14px;line-height:1.6}

.row{display:flex;align-items:center;gap:10px}
.between{justify-content:space-between}
.wrap{flex-wrap:wrap}
.grow{flex-grow:1}

.chip{display:inline-flex;align-items:center;gap:6px;height:34px;padding:0 13px;border-radius:9px;
  font-size:13px;font-weight:600;background:var(--surface);color:var(--muted);border:1px solid var(--line);white-space:nowrap}
.chip:hover{color:var(--ink)}
.chip.on{background:var(--accent);color:#fff;border-color:var(--accent)}
.chip.err{background:var(--danger-soft);color:var(--danger);border-color:transparent}
.chip.ok{background:var(--accent-soft);color:var(--accent-ink);border-color:transparent}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:52px;padding:0 18px;
  border-radius:12px;border:none;background:var(--accent);color:#fff;font-weight:700;font-size:15px;
  transition:transform .1s ease,filter .15s}
.btn:hover{filter:brightness(1.06)}.btn:active{transform:scale(.98)}
.btn.ghost{background:var(--surface);color:var(--ink);border:1px solid var(--line)}
.btn.ghost:hover{border-color:var(--muted);filter:none}
.btn.accent{background:var(--accent);color:#fff}
.btn.sm{height:42px;font-size:14px;padding:0 14px;border-radius:10px}
.btn.block{width:100%}

.play{width:44px;height:44px;border-radius:11px;border:1px solid var(--line);background:var(--surface);
  color:var(--accent);display:flex;align-items:center;justify-content:center;padding:0;flex:0 0 auto;transition:transform .1s}
.play:hover{background:var(--accent-soft);border-color:var(--accent)}.play:active{transform:scale(.94)}
.play.lg{width:66px;height:66px;border-radius:18px;background:var(--accent);color:#fff;border:none;box-shadow:0 10px 22px rgba(27,77,255,.3)}
.play.lg:hover{filter:brightness(1.06);background:var(--accent)}
.play.speaking{animation:pulse 1s ease-in-out infinite}
@keyframes pulse{50%{transform:scale(1.08)}}

.tabs{position:fixed;bottom:0;left:0;right:0;max-width:480px;margin:0 auto;
  background:color-mix(in srgb, var(--surface) 90%, transparent);
  -webkit-backdrop-filter:saturate(1.5) blur(16px);backdrop-filter:saturate(1.5) blur(16px);
  border:1px solid var(--line);border-bottom:none;border-radius:26px 26px 0 0;
  box-shadow:0 -10px 30px rgba(0,0,0,.09);
  display:flex;padding:9px 10px calc(9px + env(safe-area-inset-bottom));z-index:20}
.tab{flex:1;background:none;border:none;padding:4px 2px;display:flex;flex-direction:column;align-items:center;gap:4px;
  color:var(--faint);font-size:11px;font-weight:600;border-radius:14px;-webkit-tap-highlight-color:transparent}
.tab.on{color:var(--accent)}
.tab.on b{font-weight:700}
.tab-ic{display:flex;align-items:center;justify-content:center;width:46px;height:36px;border-radius:18px;transition:background .22s cubic-bezier(.2,.8,.2,1),transform .22s cubic-bezier(.2,.8,.2,1),box-shadow .22s ease}
.tab.on .tab-ic{background:var(--accent-soft);transform:translateY(-2px);box-shadow:0 6px 16px color-mix(in srgb, var(--accent) 26%, transparent)}
.tab:active .tab-ic{transform:scale(.88)}
.tab svg{width:23px;height:23px}
.pt-ic svg{width:24px;height:24px}
/* Nút chat AI nổi trên Hôm nay (tính năng key) */
.fab-wrap{position:fixed;left:0;right:0;bottom:calc(150px + env(safe-area-inset-bottom));max-width:480px;margin:0 auto;display:flex;justify-content:flex-end;padding:0 18px;pointer-events:none;z-index:25}
.fab{pointer-events:auto;position:relative;width:60px;height:60px;border-radius:50%;background:var(--accent);color:#fff;border:none;display:flex;align-items:center;justify-content:center;box-shadow:0 12px 28px color-mix(in srgb, var(--accent) 45%, transparent);animation:fabBounce 2.6s ease-in-out infinite}
.fab svg{width:27px;height:27px}
.fab .fab-dot{position:absolute;top:-3px;right:-3px;background:#fff;color:var(--accent);font-size:11px;font-weight:800;font-family:var(--mono);width:22px;height:22px;border-radius:50%;display:flex;align-items:center;justify-content:center;box-shadow:0 2px 6px rgba(0,0,0,.2)}
.fab::after{content:"";position:absolute;inset:0;border-radius:50%;box-shadow:0 0 0 0 color-mix(in srgb, var(--accent) 50%, transparent);animation:fabPulse 2.6s ease-out infinite}
.fab:active{transform:scale(.92)}
@keyframes fabBounce{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
@keyframes fabPulse{0%{box-shadow:0 0 0 0 color-mix(in srgb, var(--accent) 45%, transparent)}70%{box-shadow:0 0 0 16px color-mix(in srgb, var(--accent) 0%, transparent)}100%{box-shadow:0 0 0 0 color-mix(in srgb, var(--accent) 0%, transparent)}}

.bar{height:8px;border-radius:5px;background:var(--line);overflow:hidden}
.bar>i{display:block;height:100%;border-radius:5px;background:var(--accent);transition:width .5s cubic-bezier(.2,.8,.2,1)}

.flash{min-height:210px;justify-content:center;align-items:stretch;gap:16px;text-align:center}
.term{font-family:var(--disp);font-size:32px;font-weight:800;letter-spacing:-.02em}
.ipa{font-family:var(--mono);color:var(--muted);font-size:15px}
.divider{height:1px;background:var(--line)}
.reveal-hint{color:var(--faint);font-size:13.5px}
.answer{display:flex;flex-direction:column;gap:12px;text-align:left}
.answer .vi{font-family:var(--disp);font-size:20px;font-weight:800;line-height:1.25;letter-spacing:-.01em}
.ex{font-size:15px;line-height:1.55}
.ex .hl{color:var(--accent);font-weight:700}
.ex-vi{color:var(--muted);font-size:13.5px}
.grade{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:9px}
.grade .btn{height:54px;flex-direction:column;gap:2px;font-size:14px;padding:0}
.grade .btn small{font-size:10.5px;font-weight:500;opacity:.7}

.silist{padding:0}
.si{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:15px 4px;
  border:none;border-bottom:1px solid var(--line);width:100%;background:none;text-align:left;color:inherit}
.si:last-child{border-bottom:none}
.si b{font-weight:700;font-size:15px}
.si small{color:var(--muted);font-size:12.5px}
.phrase{display:flex;gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}
.phrase:last-child{border-bottom:none}
.phrase .en{font-size:15.5px;line-height:1.4;font-weight:600}
.phrase .vi{color:var(--muted);font-size:13.5px;margin-top:2px}
.phrase .note{color:var(--amber);font-size:12.5px;margin-top:5px}

.bubble{max-width:88%;padding:12px 15px;border-radius:14px;font-size:15px;line-height:1.45}
.bubble.them{background:var(--surface2);border:1px solid var(--line);align-self:flex-start;border-bottom-left-radius:4px}
.bubble.you{background:var(--accent);color:#fff;align-self:flex-end;border-bottom-right-radius:4px}
.who{font-size:11.5px;color:var(--faint);margin:0 6px 5px;font-family:var(--mono)}
.opt{width:100%;min-height:56px;text-align:left;padding:14px 16px;border-radius:12px;border:1px solid var(--line);
  background:var(--surface);color:var(--ink);font-size:15px;line-height:1.4;display:flex;align-items:center;justify-content:space-between;gap:10px}
/* Thanh hành động ghim trên tab bar (tầm ngón cái) — dùng chung cho Kiểm tra, Nghe, Ngày, Thẻ lật */
.pinbar{position:sticky;bottom:calc(76px + env(safe-area-inset-bottom));margin:10px -18px -4px;padding:12px 18px 8px;z-index:6;
  background:linear-gradient(180deg,transparent 0%,var(--bg) 42%);display:flex;flex-direction:column;gap:9px}
.pinbar .row{gap:10px}
.opt:hover{border-color:var(--accent)}
.opt.good{border-color:var(--accent);background:var(--accent-soft)}
.opt.bad{border-color:var(--danger);background:var(--danger-soft);color:var(--danger)}
.opt .fb{display:block;margin-top:6px;font-size:12.5px;color:var(--muted)}

.dgap{display:inline-block;min-width:92px;border-bottom:2px solid var(--ink);margin:0 3px;text-align:center}
.dsentence{font-size:19px;line-height:1.8}
.input{width:100%;height:52px;border-radius:12px;border:1px solid var(--line);background:var(--surface);
  color:var(--ink);font-size:16px;padding:0 15px;font-family:var(--sans)}
.input:focus{outline:none;border-color:var(--accent)}
.tokens{display:flex;flex-wrap:wrap;gap:8px}
.tok{font-family:var(--mono);padding:7px 11px;border-radius:7px;font-size:13.5px;font-weight:500;border:1px solid var(--line)}
.tok.hit{background:var(--accent-soft);color:var(--accent-ink);border-color:transparent}
.tok.miss{background:var(--danger-soft);color:var(--danger);border-color:transparent}

.tiles{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px;
  display:flex;flex-direction:column;gap:6px;text-align:left;align-items:stretch;color:inherit}
.tile:hover{border-color:var(--accent)}
.tile .n{font-family:var(--disp);font-size:28px;font-weight:800;letter-spacing:-.02em}
.tile .l{font-size:13px;color:var(--muted)}
.tile .ic{color:var(--accent)}

.empty{text-align:center;color:var(--muted);padding:34px 10px;font-size:14.5px}
.toast{position:fixed;bottom:96px;left:50%;transform:translateX(-50%) translateY(20px);
  background:var(--ink);color:var(--bg);padding:11px 18px;border-radius:10px;font-size:14px;font-weight:600;
  opacity:0;pointer-events:none;transition:.25s;z-index:40;box-shadow:var(--shadow)}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.seg{display:flex;border:1px solid var(--line);border-radius:11px;overflow:hidden;background:var(--surface)}
.seg button{flex:1;height:38px;border:none;border-right:1px solid var(--line);background:none;color:var(--muted);font-size:13px;font-weight:600}
.seg button:last-child{border-right:none}
.seg button.on{background:var(--accent);color:#fff}
/* Danh sách nhóm kiểu iOS (Cấu hình) */
.ios-lab{font-family:var(--mono);font-size:11px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);padding:0 6px 8px}
.iosg{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.iosr{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:52px;padding:11px 15px;width:100%;background:none;border:none;border-top:1px solid var(--line);color:inherit;text-align:left;font-size:15px}
.iosg>.iosr:first-child,.iosg>*:first-child .iosr{border-top:none}
.iosr .rl{font-size:15px}
.iosr .rv{display:flex;align-items:center;gap:7px;color:var(--muted);font-size:14px}
.ios-sub{padding:4px 15px 15px;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:12px;background:var(--surface2)}
.iosw{width:46px;height:28px;border-radius:999px;border:none;position:relative;flex:0 0 auto;transition:background .18s}
.iosw i{position:absolute;top:3px;width:22px;height:22px;border-radius:999px;background:#fff;transition:left .18s;box-shadow:0 1px 3px rgba(0,0,0,.3)}
</style>

<div class="shell">
  <header class="top">
    <div class="brand-wrap">
      <div class="logo"><svg viewBox="0 0 100 100" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M60 26H36a6 6 0 0 0-6 6v36a6 6 0 0 0 6 6h24" stroke="#fff" stroke-width="8.5"/><path d="M36 50h16" stroke="#9db8ff" stroke-width="8.5"/><path d="M70 40l8 10-8 10" stroke="#9db8ff" stroke-width="7.5"/></svg></div>

if(!store.cfg)store.cfg={};
(function(dflt){for(var k in dflt){if(store.cfg[k]===undefined)store.cfg[k]=dflt[k];}})(
  {autoSpeak:true,secCard:5,secPhrase:6,secListen:5,rate:0.95,vRepeat:1,vReadEx:true,pRepeat:1,lRepeat:2,voiceLang:'auto',dailyGoal:4,remind:'',level:'A2'});

function todayStr(){return new Date().toISOString().slice(0,10);}
function bumpActivity(){ // đếm lượt học (heatmap) + tích luỹ đóng băng streak (E3)
  var d=todayStr();store.hist[d]=(store.hist[d]||0)+1;
  var st=store.stats;st.luot=(st.luot||0)+1;st.lastHour=new Date().getHours(); // E1: giờ quen
  if(st.luot>=20){st.luot-=20;st.freeze=Math.min(2,(st.freeze||0)+1);toast('❄️ +1 đóng băng streak (có '+st.freeze+')','ok');}
}
function isStandalone(){try{return window.matchMedia('(display-mode: standalone)').matches||window.navigator.standalone===true;}catch(e){return false;}}
function isIOS(){return /iphone|ipad|ipod/i.test(navigator.userAgent||'');}
function remainingTasksText(){
  var t=todayStr();var done=(store.today&&store.today.date===t)?store.today.done:{};
  var tasks=homeTasks();var rem=tasks.filter(function(x){return !done[x.key];});
  if(!rem.length)return '';

function checkReminder(){ // E1/C3: nhắc học best-effort (chạy khi mở app)

    if(isIOS()&&!isStandalone())return; // iOS: chỉ khi đã cài ra màn hình chính
    var t=todayStr(),now=new Date();
    var st=store.stats;if(st.remindDate!==t){st.remindDate=t;st.remindCount=0;}
    if((st.remindCount||0)>=2)return; // ≤2 lần/ngày
    var parts=(store.cfg.remind||'20:00').split(':');var due=new Date();due.setHours(+parts[0]||20,+parts[1]||0,0,0);
    if(now<due)return;
    var msg=remainingTasksText();if(!msg)return; // đã xong hết thì thôi
    st.remindCount=(st.remindCount||0)+1;save(store);

function advanceStreak(){ // D3: streak chỉ tăng khi hoàn thành ≥1 việc trong ngày

  if(st.lastActive){
    var gap=Math.round((new Date(d+'T00:00:00')-new Date(st.lastActive+'T00:00:00'))/864e5);
    if(gap===1){st.streak=(st.streak||0)+1;}
    else if(gap>=2&&(st.freeze||0)>0){st.freeze--;st.streak=(st.streak||0)+1;toast('❄️ Đã dùng 1 đóng băng — chuỗi giữ nguyên','ok');}

  }else{st.streak=1;}
  st.lastActive=d;
}
function curStreak(){var st=store.stats;var d=todayStr();var y=new Date(Date.now()-864e5).toISOString().slice(0,10);return (st.lastActive===d||st.lastActive===y)?(st.streak||0):0;}

}
function due(){
  const now=Date.now();
  return allVocab().filter(v=>{const c=store.srs[v.t];return !c||c.due<=now;});
}
function grade(term,g){ // g: 0 again,1 hard,2 good,3 easy
  const c=store.srs[term]||{ease:2.3,int:0,reps:0};
  if(g===0){c.reps=0;c.int=0;}
  else{
    c.reps++;
    if(c.reps===1)c.int=1;
    else if(c.reps===2)c.int=3;
    else c.int=Math.round(c.int*c.ease);
    c.ease=Math.max(1.3,c.ease+(g===1?-0.15:g===3?0.15:0));
    if(g===1)c.int=Math.max(1,Math.round(c.int*0.6));
  }
  const days=g===0?0:c.int;
  c.due=Date.now()+days*864e5 + (g===0?60000:0);
  store.srs[term]=c;
  store.stats.done=(store.stats.done||0)+1;
  bumpActivity();save(store);
}

      ||vs.find(v=>re.test(v.lang))
      ||vs.find(v=>/^en/i.test(v.lang))||null;
}

// Vuốt thẻ: trái = onLeft (ôn lại), phải = onRight (nhớ), kèm lớp phủ màu báo trước
function attachSwipe(node,onLeft,onRight){
  var x0=null,y0=null,drag=false;
  node.style.touchAction='pan-y';node.style.position='relative';
  var bl=el('div','swipe-badge l','↺ Ôn lại'),br=el('div','swipe-badge r','✓ Nhớ');
  node.appendChild(bl);node.appendChild(br);
  node.addEventListener('pointerdown',function(e){x0=e.clientX;y0=e.clientY;drag=true;node.style.transition='none';});
  node.addEventListener('pointermove',function(e){
    if(!drag||x0===null)return;var dx=e.clientX-x0,dy=e.clientY-y0;
    if(Math.abs(dx)>Math.abs(dy)){
      node.style.transform='translateX('+dx+'px) rotate('+(dx*0.03)+'deg)';node.style.opacity=String(Math.max(.5,1-Math.abs(dx)/500));
      var o=Math.min(1,Math.abs(dx)/90);bl.style.opacity=dx<0?String(o):'0';br.style.opacity=dx>0?String(o):'0';
    }
  });
  function reset(){node.style.transform='';node.style.opacity='';bl.style.opacity='0';br.style.opacity='0';}
  function end(e){
    if(!drag)return;drag=false;var dx=(e.clientX||x0)-x0;node.style.transition='transform .2s ease,opacity .2s ease';
    if(dx<=-70){node.style.transform='translateX(-120%) rotate(-6deg)';node.style.opacity='0';setTimeout(onLeft,150);}
    else if(dx>=70){node.style.transform='translateX(120%) rotate(6deg)';node.style.opacity='0';setTimeout(onRight,150);}
    else reset();
    x0=null;
  }
  node.addEventListener('pointerup',end);node.addEventListener('pointercancel',function(){drag=false;reset();});
}

  const plus=el('button','btn ghost');plus.style.cssText='width:40px;height:40px;padding:0;font-size:20px';plus.textContent='+';

function quickBuild(){
  var items=[];
  var dueW=due().slice();if(dueW.length<5)dueW=allVocab().slice(0,5);
  dueW.slice(0,5).forEach(function(w){items.push({t:'vocab',w:w});});
  var ph=[];PHRASES.forEach(function(g){g.items.forEach(function(it){ph.push(it);});});shuffleArr(ph);
  ph.slice(0,2).forEach(function(it){items.push({t:'phrase',it:it});});
  if(DICTATION.length)items.push({t:'listen',d:DICTATION[Math.floor(Math.random()*DICTATION.length)]});
  if(aiConfigured())items.push({t:'chat'});
  return items;
}

let vMode='card', vTopic='all';

function todayVocabPool(){ // A4: từ của ngày lộ trình hiện tại + từ SRS tới hạn
  var n=store.days.cur||1, day=DAYS[n-1]||{};
  var words=(day.v||[]).map(function(i){return VOCAB[i];}).filter(Boolean);
  var have={};words.forEach(function(w){have[w.t]=1;});
  due().forEach(function(w){if(!have[w.t]){have[w.t]=1;words.push(w);}});
  return words.length?words.slice(0,15):allVocab().slice(0,5);
}
function vTopicPool(){
  if(vTopic==='all')return allVocab();
  if(vTopic==='today')return todayVocabPool();
  if(vTopic==='mine')return (store.myVocab||[]).slice();
  if(vTopic==='weak')return weakWords();
  return VOCAB.slice(vTopic*10,vTopic*10+10);
}
function vVocab(){
  if(vMode==='list'){vList();return;}
  if(vMode==='quiz'){vQuizStart();return;}
  const pool=vTopicPool();

    if(vTopic==='mine'){vExtract();return;}
    if(vTopic==='weak'){toast('Chưa có từ nào hay sai 👍');vTopic='all';}
  }
  const pool2=vTopicPool();
  let q=pool2.filter(function(w){const c=store.srs[w.t];return !c||c.due<=Date.now();});

let qz=[],qzi=0,qzScore=0,qzAns=null;
function vQuizStart(){
  const pool=vTopicPool().slice();
  for(let i=pool.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));const t=pool[i];pool[i]=pool[j];pool[j]=t;}
  qz=pool.slice(0,Math.min(10,pool.length)).map(function(w){
    const dir=Math.random()<0.5?'en2vi':'vi2en';
    const others=allVocab().filter(function(x){return x.t!==w.t;});
    for(let i=others.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));const t=others[i];others[i]=others[j];others[j]=t;}
    const d3=others.slice(0,3);
    let opts,correct,prompt;
    if(dir==='en2vi'){prompt=w.t;correct=w.vi;opts=[w.vi].concat(d3.map(function(x){return x.vi;}));}
    else{prompt=w.vi;correct=w.t;opts=[w.t].concat(d3.map(function(x){return x.t;}));}
    for(let i=opts.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));const t=opts[i];opts[i]=opts[j];opts[j]=t;}
    return {w:w,dir:dir,prompt:prompt,correct:correct,opts:opts};
  });
  qzi=0;qzScore=0;qzAns=null;drawQuiz();
}

    const b=el('button','btn accent block');b.textContent='Làm lại';b.onclick=vQuizStart;done.appendChild(b);
    v.appendChild(done);main.appendChild(v);return;
  }
  const prog=el('div','row between');prog.innerHTML='<span class="muted">Câu '+(qzi+1)+'/'+total+'</span><span class="chip ok" style="height:26px">Đúng '+qzScore+'</span>';v.appendChild(prog);
  const bar=el('div','bar');bar.innerHTML='<i style="width:'+Math.round(qzi/total*100)+'%"></i>';v.appendChild(bar);
  const q=qz[qzi];

  card.appendChild(el('div','eyebrow',q.dir==='en2vi'?'Nghĩa của từ này?':'Từ tiếng Anh?'));

  card.appendChild(prow);v.appendChild(card);

      else if(o===qzAns){btn.classList.add('bad');btn.insertAdjacentHTML('beforeend','<span style="display:inline-flex;color:var(--danger)">'+ICO.x+'</span>');}
    }else{

function confirmBtn(cls,label,onConfirm){

function convoReadStart(c){
  if(!('speechSynthesis'in window)){toast('Trình duyệt không hỗ trợ đọc');return;}
  try{speechSynthesis.cancel();}catch(e){}
  convoReading=true;convoReadIdx=-1;
  var turns=(c.turns||[]);
  turns.forEach(function(m,i){
    var txt=(m.role==='assistant'?aiParse(m.content).reply:m.content).replace(/<[^>]+>/g,'');
    if(!txt)return;
    var u=new SpeechSynthesisUtterance(txt);u.lang='en-US';u.rate=(store.cfg&&store.cfg.rate)||0.95;if(VOICE)u.voice=VOICE;
    u.onstart=function(){convoReadIdx=i;if(convoView)vConvo();};

function convoScore(){ // B7: điểm & số lỗi cả buổi
  var userTurns=aiTurns.filter(function(m){return m.role==='user';}).length;
  var fixCount=0, clean=0;
  aiTurns.forEach(function(m){if(m.role==='assistant'){var its=fixItems(aiParse(m.content).fix);fixCount+=its.length;if(its.length===0)clean++;}});
  var graded=aiTurns.filter(function(m){return m.role==='assistant';}).length;
  var score=graded?Math.round(clean/graded*100):0;
  return {userTurns:userTurns,fixCount:fixCount,score:score};
}

function parseJSONLoose(t){

  const a=s.indexOf('['),b=s.lastIndexOf(']'),c=s.indexOf('{'),d=s.lastIndexOf('}');

  if(a>=0&&b>a)cand=s.slice(a,b+1);

function cheapScore(provider,id){

    if(/pro/.test(id))return 5;

    if(/8b|instant|gemma|1b|3b/.test(id))return 1;
    if(/70b|versatile|large|120b|90b/.test(id))return 4;

  }

  var fc=el('div');fc.style.cssText='background:var(--amber-soft);border-radius:12px;padding:11px 13px;margin:2px 6px 0;display:flex;flex-direction:column;gap:7px';
  var hd=el('div','row between');hd.style.gap='10px';
  hd.innerHTML='<span style="font-family:var(--mono);font-size:11px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--amber)">✎ Sửa lỗi'+(items.length>1?(' · '+items.length):'')+'</span>';
  var en=fixEnglishFrom(items,fix);
  if(en){
    var acts=el('div','row');acts.style.cssText='gap:12px;flex:0 0 auto';
    var pb=el('button');pb.style.cssText='display:inline-flex;align-items:center;gap:5px;background:transparent;border:none;color:var(--amber);font-weight:700;font-size:12.5px;padding:2px 0';pb.innerHTML=ICO.play+' Nghe';pb.setAttribute('aria-label','Nghe câu đúng');pb.onclick=function(){speak(en,pb);};acts.appendChild(pb);
    if(window.SpeechRecognition||window.webkitSpeechRecognition){var sb=el('button');sb.style.cssText='display:inline-flex;align-items:center;gap:5px;background:transparent;border:none;color:var(--amber);font-weight:700;font-size:12.5px;padding:2px 0';sb.innerHTML=ICO.mic2+' Nói lại';sb.setAttribute('aria-label','Nói lại câu đúng');sb.onclick=function(){fixSpeakBack(en,sb);};acts.appendChild(sb);}
    hd.appendChild(acts);
  }
  fc.appendChild(hd);
  if(items.length){
    items.forEach(function(it){
      var line=el('div');line.style.cssText='font-size:13.5px;line-height:1.5;color:var(--amber)';
      var html='';
      if(it.wrong)html+='<s style="opacity:.7">'+esc(it.wrong)+'</s> → ';
      if(it.right)html+='<b>'+esc(it.right)+'</b>';
      if(it.note)html+=(it.right||it.wrong?' ':'')+'<span style="opacity:.8">('+esc(it.note)+')</span>';
      line.innerHTML=html;fc.appendChild(line);
    });
  }else{var l=el('div');l.style.cssText='font-size:13.5px;line-height:1.5;color:var(--amber)';l.textContent=fix;fc.appendChild(l);}
  return fc;
}
function aiScObj(){

function aiUseCustom(label,promptS){aiCustom=label;aiCustomS=promptS||'';aiScenario='custom';aiTurns=[];aiStart();}
async function aiSuggestScenarios(){
  const sp=await aiInit();if(!sp){toast('Chưa cấu hình AI — mở “Cài đặt AI” ở tab Giao tiếp');return;}
  const d=$("#aiDomain");const domain=d?d.value.trim():'';if(!domain){toast('Điền lĩnh vực trước đã');return;}
  aiDomain=domain;aiSuggestLoading=true;vTalkAI();
  try{
    const arr=await sp.json('Suggest 4 realistic English speaking practice scenarios for a software developer working in this area: "'+domain+'". Reply ONLY as a JSON array of objects {"label": short Vietnamese label 3-6 words, "prompt": one English sentence describing who the other person is and what happens}. Real software or office situations only.',{modelTier:'quick'});
    aiSuggestions=(arr||[]).filter(function(x){return x&&x.label&&x.prompt;}).slice(0,4);
    if(!aiSuggestions.length)toast('Chưa gợi ý được, thử lại');
  }catch(e){toast('Lỗi, thử lại');}
  aiSuggestLoading=false;vTalkAI();
}

function isSaved(en){return (store.saved||[]).some(function(x){return x.en===en;});}
function toggleSaved(en,note){
  if(!store.saved)store.saved=[];
  const i=store.saved.findIndex(function(x){return x.en===en;});
  if(i>=0){store.saved.splice(i,1);toast('Đã bỏ lưu');}
  else{store.saved.unshift({en:en,note:note||'',ts:Date.now()});toast('Đã lưu câu');}
  save(store);
}

async function aiStart(){
  const sp=await aiInit();
  if(!sp){toast('Chưa cấu hình AI — mở “Cài đặt AI”');aiScenario=null;aiSettingsOpen=true;vTalkAI();return;}
  aiReviewHinted=false;aiHint='';
  aiBusy=true;aiPending='';vTalkAI();
  try{
    const r=await sp([{role:'user',content:aiRules(aiScObj().s)+" Start the conversation now with your first line."}],
      {modelTier:'quick',cache:false,onText:function(u){aiPending=u.text;const el2=document.getElementById('aiLive');if(el2)el2.textContent=aiParse(u.text).reply;}});
    aiTurns.push({role:'assistant',content:r.text});
  }catch(e){toast('Lỗi AI, thử lại');}
  aiBusy=false;aiPending='';vTalkAI();
  const last=aiTurns[aiTurns.length-1];if(last)speak(aiParse(last.content).reply);
}
async function aiSend(){
  const inp=$("#aiInput");if(!inp||aiBusy)return;const text=inp.value.trim();if(!text)return;
  const sp=await aiInit();if(!sp){toast('Chưa cấu hình AI — mở “Cài đặt AI”');return;}
  aiTurns.push({role:'user',content:text});aiBusy=true;aiPending='';vTalkAI();
  const msgs=[{role:'user',content:aiRules(aiScObj().s)}].concat(aiTurns);
  try{
    const r=await sp(msgs,{modelTier:'quick',cache:false,onText:function(u){aiPending=u.text;const el2=document.getElementById('aiLive');if(el2)el2.textContent=aiParse(u.text).reply;}});
    aiTurns.push({role:'assistant',content:r.text});store.stats.done=(store.stats.done||0)+1;bumpActivity();
    var userTurns=aiTurns.filter(function(m){return m.role==='user';}).length;
    if(userTurns>=3)markToday('talk');
    if(userTurns===3&&!aiReviewHinted){aiReviewHinted=true;toast('Đủ lượt — bấm “Kết thúc & chấm điểm buổi” dưới ô nhập','ok');}
    save(store);
  }catch(e){var em=String(e&&e.message||'');var msg=/50\d|429|overload/i.test(em)?'(AI đang bận/quá tải — thử lại sau chút)':(/empty/.test(em)?'(AI chưa trả lời được — thử lại)':'(Lỗi, thử lại)');aiTurns.push({role:'assistant',content:msg+'\nFIX: OK'});}
  aiBusy=false;aiPending='';vTalkAI();
  const last=aiTurns[aiTurns.length-1];if(last&&last.role==='assistant')speak(aiParse(last.content).reply);
}
async function aiReview(){
  const sp=await aiInit();if(!sp){toast('Chưa cấu hình AI — mở “Cài đặt AI”');return;}
  var ctx=aiTurns.map(function(m){return (m.role==='user'?'Me: ':'Colleague: ')+aiParse(m.content).reply;}).join('\n');
  toast('AI đang chấm cả buổi…');
  try{
    var r=await sp.json('This is a workplace English speaking practice between a Vietnamese developer (Me) and a colleague. Evaluate ONLY the developer (Me). Reply ONLY JSON {"score": number 1-10, "tips":[2-3 short specific improvement tips in Vietnamese], "phrases":[3 better English phrases the developer could have used]}.\n\n'+ctx,{modelTier:'quick'});
    if(!r){toast('Chưa chấm được, thử lại');return;}
    openModal(function(card,close){
      card.appendChild(el('h3',null,'Nhận xét cả buổi (AI)'));
      card.appendChild(el('div',null,'<div style="font-size:36px;font-weight:800;font-family:var(--disp);color:var(--accent);line-height:1">'+(r.score!=null?r.score:'?')+'<span style="font-size:18px;color:var(--muted)">/10</span></div>'));
      if(r.tips&&r.tips.length){card.appendChild(el('div','eyebrow','Gợi ý cải thiện'));var ul=el('div');ul.style.cssText='display:flex;flex-direction:column;gap:6px';r.tips.forEach(function(t){ul.appendChild(el('div','muted','• '+t));});card.appendChild(ul);}
      if(r.phrases&&r.phrases.length){card.appendChild(el('div','eyebrow','Mẫu câu nên dùng'));r.phrases.forEach(function(ph){var row=el('div','row');row.style.gap='8px';var bx=el('div','grow');bx.style.cssText='font-size:14.5px;line-height:1.4';bx.textContent=ph;row.appendChild(bx);row.appendChild(playBtn(ph));card.appendChild(row);});}
      var cl=el('button','btn accent block');cl.textContent='Đóng';cl.onclick=close;card.appendChild(cl);
    });
  }catch(e){toast('Lỗi AI, thử lại');}
}
async function aiSuggest(){
  const sp=await aiInit();if(!sp){toast('Chưa cấu hình AI — mở “Cài đặt AI”');return;}
  if(aiBusy)return;
  const ctx=aiTurns.map(function(m){return (m.role==='user'?'Me: ':'Colleague: ')+aiParse(m.content).reply;}).join('\n');
  toast('Đang nghĩ gợi ý…');
  try{const r=await sp('In this workplace conversation, suggest ONE short simple English sentence that I (the developer) could say next. Reply with ONLY the sentence.\n\n'+ctx,{modelTier:'quick'});
    aiHint=r.text.trim().replace(/^["‘’“”]+|["‘’“”]+$/g,'');vTalkAI();
    const inp=$("#aiInput");if(inp)inp.focus();}
  catch(e){toast('Lỗi gợi ý');}
}
function aiMic(){
  const SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(!SR){toast('Trình duyệt không hỗ trợ nói');return;}
  const btn=$('#aiMicBtn');
  const r=new SR();r.lang=voiceLang();r.interimResults=false;
  if(btn)btn.classList.add('listening');
  r.onresult=function(e){const t=e.results[0][0].transcript;const inp=$("#aiInput");if(inp){inp.value=t;inp.focus();}};
  r.onerror=function(){toast('Không nghe được, thử lại');};
  r.onend=function(){if(btn)btn.classList.remove('listening');};
  try{r.start();toast('Đang nghe… nói tiếng Anh');}catch(e){if(btn)btn.classList.remove('listening');}
}

  const big=el('button','play lg');big.innerHTML=ICO.play;big.setAttribute('aria-label','Nghe câu');big.onclick=function(){speak(full,big);};
  player.appendChild(big);
  const speeds=el('div','row wrap');speeds.style.cssText='gap:8px;justify-content:center';
  [['0.6× chậm',0.6,1],['1× thường',0.9,1],['Nghe 2 lần',0.9,2]].forEach(function(sp){
    const c=el('button','chip',sp[0]);c.onclick=function(){speechSynthesis.cancel();for(var i=0;i<sp[2];i++){const u=new SpeechSynthesisUtterance(full);u.lang=voiceLang();u.rate=sp[1];if(VOICE)u.voice=VOICE;speechSynthesis.speak(u);}};speeds.appendChild(c);
  });
  player.appendChild(speeds);
  return player;
}
function lDiff(){
  const said=(lHeard||'').split(/\s+/).map(lNorm).filter(Boolean);
  return DICTATION[lIdx].s.map(function(tw){
    const n=lNorm(tw); if(!n)return {w:tw,hit:true};
    const k=said.indexOf(n); if(k>=0){said.splice(k,1);return {w:tw,hit:true};} return {w:tw,hit:false};
  });
}
function lTokens(diff){
  const toks=el('div','tokens');
  diff.forEach(function(d){toks.appendChild(el('span','tok '+(d.hit?'hit':'miss'),d.w));});
  return toks;
}

function lCheckDict(){const i=$("#dInput");lHeard=i?i.value:'';lChecked=true;bumpActivity();var df=lDiff();var hit=df.filter(function(d){return d.hit;}).length;markListen(Math.round(hit/df.length*100));vListen();}
function lShadow(){
  const SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(!SR){toast('Trình duyệt không hỗ trợ mic — chuyển sang Chép chính tả để gõ');return;}
  const r=new SR();r.lang='en-US';r.interimResults=false;var done=false;
  var to=setTimeout(function(){if(done)return;done=true;try{r.stop();}catch(e){}toast('Mic không phản hồi sau 6s — thử Chrome/Safari hoặc dùng Chép chính tả');},6000);
  r.onresult=function(e){if(done)return;done=true;clearTimeout(to);lHeard=e.results[0][0].transcript;lChecked=true;bumpActivity();var df=lDiff();var hit=df.filter(function(d){return d.hit;}).length;markListen(Math.round(hit/df.length*100));vListen();};
  r.onerror=function(){if(done)return;done=true;clearTimeout(to);toast('Không nghe được, thử lại');};
  try{r.start();toast('Đang nghe… nói nhại câu mẫu');}catch(e){clearTimeout(to);}
}

// PHRASE = Câu thường dùng (1000 câu)
const PHRASES=window.PHRASES||[];
function shuffleArr(a){for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t;}return a;}
let pqz=[],pqi=0,pqScore=0,pqAns=null;
function startPhraseQuiz(n){
  var all=[];PHRASES.forEach(function(g){g.items.forEach(function(it){all.push(it);});});
  if(all.length<4){toast('Chưa đủ câu để kiểm tra');return;}
  shuffleArr(all);
  pqz=all.slice(0,n).map(function(it){
    var others=all.filter(function(x){return x.en!==it.en;});shuffleArr(others);
    var opts=[it.en].concat(others.slice(0,3).map(function(x){return x.en;}));shuffleArr(opts);
    return {vi:it.vi,en:it.en,opts:opts};
  });
  pqi=0;pqScore=0;pqAns=null;drawPhraseQuiz();
}
function drawPhraseQuiz(){
  main.innerHTML="";const v=el('div','view');
  const back=el('button','btn ghost sm');back.style.alignSelf='flex-start';back.textContent='‹ Câu thường dùng';back.onclick=vPhrase;v.appendChild(back);
  const total=pqz.length;
  if(pqi>=total){
    if(total>0)markToday('phrases');
    const done=el('div','card');done.style.textAlign='center';done.style.gap='14px';done.style.padding='36px 16px';
    done.innerHTML='<div style="font-size:22px;font-weight:800;font-family:var(--disp)">'+pqScore+'/'+total+' đúng</div><div class="muted">'+(pqScore===total?'Tuyệt vời!':'Ôn thêm ở chế độ thẻ lật nhé.')+'</div>';
    done.appendChild(nextTaskBtn());
    const ag=el('button','btn ghost block');ag.textContent='Làm lại';ag.onclick=function(){startPhraseQuiz(total);};done.appendChild(ag);
    v.appendChild(done);main.appendChild(v);return;
  }
  const prog=el('div','row between');prog.innerHTML='<span class="muted">Câu '+(pqi+1)+'/'+total+'</span><span class="chip ok" style="height:26px">Đúng '+pqScore+'</span>';v.appendChild(prog);
  const bar=el('div','bar');bar.innerHTML='<i style="width:'+Math.round(pqi/total*100)+'%"></i>';v.appendChild(bar);
  const q=pqz[pqi];
  const card=el('div','card cardIn');card.appendChild(el('div','eyebrow','Câu tiếng Anh nào đúng nghĩa?'));
  card.appendChild(el('div',null,'<div style="font-size:18px;font-weight:600;line-height:1.4">'+q.vi+'</div>'));v.appendChild(card);
  const ow=el('div');ow.style.cssText='display:flex;flex-direction:column;gap:10px';
  q.opts.forEach(function(o){
    const btn=el('button','opt',o);
    if(pqAns!=null){btn.disabled=true;if(o===q.en)btn.classList.add('good');else if(o===pqAns)btn.classList.add('bad');
      if(o===q.en){var pb=el('button','play');pb.innerHTML=ICO.play;pb.style.cssText='width:36px;height:36px;margin-top:8px';pb.onclick=function(e){e.stopPropagation();speak(o,pb);};btn.appendChild(pb);}
    }else{btn.onclick=function(){pqAns=o;if(o===q.en){pqScore++;speak(o);}bumpActivity();save(store);drawPhraseQuiz();};}
    ow.appendChild(btn);
  });
  v.appendChild(ow);
  if(pqAns!=null){const nx=el('button','btn accent block');nx.textContent=pqi<total-1?'Câu tiếp':'Xem kết quả';nx.onclick=function(){pqi++;pqAns=null;drawPhraseQuiz();};v.appendChild(nx);}
  main.appendChild(v);window.scrollTo(0,0);
}
let pcGroup=0, pcQuery="";
function copyText(t,btn){
  const ok=()=>{if(btn){const o=btn.innerHTML;btn.innerHTML=ICO.check;setTimeout(()=>btn.innerHTML=o,900);}toast("Đã copy");};
  const fb=()=>{const ta=document.createElement('textarea');ta.value=t;ta.style.position='fixed';ta.style.opacity='0';document.body.appendChild(ta);ta.select();try{document.execCommand('copy');ok();}catch(_){}ta.remove();};
  try{if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(t).then(ok,fb);else fb();}catch(e){fb();}
}
function exportCSV(filename,rows){ // E15: xuất Anki/CSV (term,meaning,example)
  rows=(rows||[]).filter(Boolean);
  if(!rows.length){toast('Chưa có từ nào để xuất');return;}
  var csv='term,meaning,example\n'+rows.map(function(r){
    return [r.t||'',r.vi||'',String(r.ex||'').replace(/<[^>]+>/g,'')].map(function(s){return '"'+String(s).replace(/"/g,'""')+'"';}).join(',');
  }).join('\n');
  var isClaude=/claude\.ai$|claude\.site$|anthropic/.test(location.hostname||'');
  if(isClaude){copyText(csv);toast('Đã copy CSV vào clipboard (tải file chạy khi mở ngoài Claude)');return;}
  try{
    var blob=new Blob([csv],{type:'text/csv;charset=utf-8'}),url=URL.createObjectURL(blob);
    var a=document.createElement('a');a.href=url;a.download=filename;document.body.appendChild(a);a.click();a.remove();
    setTimeout(function(){URL.revokeObjectURL(url);},1000);toast('Đã xuất '+rows.length+' từ ('+filename+')','ok');
  }catch(e){copyText(csv);toast('Trình duyệt chặn tải — đã copy CSV vào clipboard');}
}

  top.innerHTML='<div class="eyebrow">'+it.g+'</div><div style="font-size:22px;font-weight:600;line-height:1.4">'+it.en+'</div>';
  const pb=el('button','play');pb.innerHTML=ICO.play;pb.setAttribute('aria-label','Nghe');pb.onclick=function(e){e.stopPropagation();speak(it.en,pb);};top.appendChild(pb);
  c.appendChild(top);
  if(!rnShow){const h=el('div','reveal-hint',apOn?'Đang tự động…':'Chạm để xem nghĩa');c.appendChild(h);if(!apOn){c.style.cursor="pointer";c.onclick=function(){rnShow=true;drawRandom();speak(it.en);};}}
  else{
    c.appendChild(el('div','divider'));
    const a=el('div','answer');a.innerHTML='<div class="vi">'+it.vi+'</div>';
    const acts=el('div','row');acts.style.cssText='gap:8px;margin-top:2px';
    const on=isSaved(it.en);const sv=el('button','btn ghost sm');sv.textContent=on?'★ Đã lưu':'Lưu câu';sv.onclick=function(){toggleSaved(it.en,it.g);drawRandom();};acts.appendChild(sv);
    const cpb=el('button','btn ghost sm');cpb.textContent='Chép lại';cpb.onclick=function(){copyText(it.en,cpb);};acts.appendChild(cpb);
    a.appendChild(acts);c.appendChild(a);
  }
  v.appendChild(c);
  if(rnShow&&!apOn){
    const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
    if(rnScored){
      const said=(rnHeard||'').split(/\s+/).map(lNorm).filter(Boolean);
      const diff=it.en.split(/\s+/).map(function(w){var n=lNorm(w);if(!n)return {w:w,hit:true};var k=said.indexOf(n);if(k>=0){said.splice(k,1);return {w:w,hit:true};}return {w:w,hit:false};});
      const hit=diff.filter(function(d){return d.hit;}).length;const pct=Math.round(hit/diff.length*100);
      const sc=el('div','card');sc.style.gap='10px';
      const scRow=el('div','row between');
      const scc=pct>=80?'var(--accent-ink)':(pct>=50?'var(--amber)':'var(--danger)');
      scRow.innerHTML='<span class="eyebrow">Đọc theo · giống</span><span style="font-weight:700;font-size:20px;color:'+scc+'">'+pct+'%</span>';
      sc.appendChild(scRow);sc.appendChild(lTokens(diff));
      const rt=el('button','btn ghost sm');rt.style.alignSelf='flex-start';rt.textContent='Đọc lại';rt.onclick=function(){rnHeard='';rnScored=false;rnTypeMode=false;drawRandom();};sc.appendChild(rt);
      v.appendChild(sc);
    }else if(rnTypeMode){
      const tb=el('div','card');tb.style.gap='10px';
      tb.appendChild(el('div','muted','Gõ lại câu mẫu (thay cho nói):'));
      const ti=el('input','input');ti.id='rnType';ti.placeholder='Gõ câu…';ti.autocomplete='off';ti.autocapitalize='off';
      ti.onkeydown=function(e){if(e.key==='Enter')rnApply(ti.value);};tb.appendChild(ti);
      const cb=el('button','btn accent block');cb.textContent='Chấm';cb.onclick=function(){var el2=$("#rnType");rnApply(el2?el2.value:'');};tb.appendChild(cb);
      v.appendChild(tb);setTimeout(function(){var i=$("#rnType");if(i)i.focus();},40);
    }else if(SR){
      const mb=el('div','card');mb.style.cssText='background:var(--accent-soft);gap:12px;flex-direction:row;align-items:center;padding:14px';
      const mic=el('button');mic.style.cssText='width:48px;height:48px;border-radius:12px;background:var(--accent);color:#fff;border:none;flex:0 0 auto;display:flex;align-items:center;justify-content:center';mic.innerHTML=ICO.mic2;mic.setAttribute('aria-label','Đọc theo để chấm');mic.onclick=function(){rnMic(it.en);};
      const mtx=el('div','grow');mtx.innerHTML='<div style="font-size:15px;font-weight:700">Đọc theo để chấm</div><div class="muted" style="font-size:12.5px">Bấm rồi đọc · chấm % giống câu mẫu</div>';
      const gt=el('button','btn ghost sm');gt.textContent='Gõ thay';gt.style.flex='0 0 auto';gt.onclick=function(){rnTypeMode=true;drawRandom();};
      mb.appendChild(mic);mb.appendChild(mtx);mb.appendChild(gt);
      v.appendChild(mb);
    }
    const nav=el('div','row');nav.style.gap='10px';
    const rp=el('button','btn ghost');rp.style.flex='0 0 auto';rp.innerHTML=ICO.play+' Nghe lại';rp.onclick=function(){speak(it.en,rp);};nav.appendChild(rp);
    const nx=el('button','btn accent grow');nx.textContent=(rnIdx<total-1?'Câu tiếp ›':'Xong');
    nx.onclick=function(){rnIdx++;rnShow=false;rnHeard='';rnScored=false;rnTypeMode=false;store.stats.done=(store.stats.done||0)+1;bumpActivity();save(store);drawRandom();};nav.appendChild(nx);
    v.appendChild(pinBar(nav));
  }
  main.appendChild(v);window.scrollTo(0,0);
}
