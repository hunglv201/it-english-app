<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&family=Hanken+Grotesk:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap">
  <style>
body{margin:0;background:#f5f6f8;color:#14161a;font-family:'Hanken Grotesk',system-ui,-apple-system,sans-serif;font-size:16px;line-height:1.55;-webkit-font-smoothing:antialiased}
a{color:#1b4dff}a:hover{color:#1740d6}
.phone{width:390px;min-height:844px;background:#f5f6f8;display:flex;flex-direction:column;position:relative}
.top{padding:22px 20px 12px;display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand-wrap{display:flex;align-items:center;gap:11px}
.logo{width:40px;height:40px;border-radius:11px;background:linear-gradient(140deg,#4f7bff,#1234d8);display:flex;align-items:center;justify-content:center;box-shadow:0 6px 14px rgba(27,77,255,.3);color:#fff;font-family:'IBM Plex Mono',ui-monospace,monospace;font-weight:600;font-size:15px;letter-spacing:-.04em}
.brand{font-family:'Bricolage Grotesque','Hanken Grotesk',system-ui,sans-serif;font-size:18px;font-weight:800;letter-spacing:-.02em;line-height:1}
.top-actions{display:flex;align-items:center;gap:8px}
.streak{display:flex;align-items:center;gap:6px;height:36px;padding:0 12px;border-radius:9px;background:#fff;border:1px solid #e6e8ec;font-family:'IBM Plex Mono',ui-monospace,monospace;font-size:14px;font-weight:600}
.streak b{color:#1b4dff}
.icobtn{width:38px;height:38px;border-radius:11px;border:1px solid #e6e8ec;background:#fff;color:#6b7280;display:flex;align-items:center;justify-content:center}
.main{flex-grow:1;padding:6px 18px 100px;display:flex;flex-direction:column;gap:16px}
.card{background:#fff;border:1px solid #e6e8ec;border-radius:16px;padding:18px;display:flex;flex-direction:column;gap:14px}
.eyebrow{font-family:'IBM Plex Mono',ui-monospace,monospace;font-size:11px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:#6b7280}
.disp{font-family:'Bricolage Grotesque','Hanken Grotesk',system-ui,sans-serif;font-weight:800;letter-spacing:-.02em}
.muted{color:#6b7280;font-size:14.5px}
.mono{font-family:'IBM Plex Mono',ui-monospace,monospace}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;height:52px;padding:0 18px;border-radius:12px;border:none;background:#1b4dff;color:#fff;font-weight:700;font-size:15px;width:100%}
.btn.ghost{background:#fff;color:#14161a;border:1px solid #e6e8ec}
.btn.sm{height:42px;font-size:14px;padding:0 14px;border-radius:10px;width:auto}
.si{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 4px;border-bottom:1px solid #e6e8ec}
.si:last-child{border-bottom:none}
.tick{width:28px;height:28px;border-radius:999px;display:flex;align-items:center;justify-content:center;flex:0 0 auto;background:#f0f2f5;color:#9aa1ad}
.tick.on{background:#1b4dff;color:#fff}
.tick.next{background:#e9eeff;color:#1b4dff;border:2px solid #1b4dff}
.bar{height:8px;border-radius:5px;background:#e6e8ec;overflow:hidden}
.bar i{display:block;height:100%;border-radius:5px;background:#1b4dff}
.chip{display:inline-flex;align-items:center;gap:6px;height:30px;padding:0 11px;border-radius:9px;font-size:12.5px;font-weight:600;background:#fff;color:#6b7280;border:1px solid #e6e8ec;white-space:nowrap}
.chip.ok{background:#e9eeff;color:#1740d6;border-color:transparent}
.heat{display:grid;grid-template-columns:repeat(14,minmax(0,1fr));gap:4px}
.heat i{display:block;aspect-ratio:1;border-radius:4px;background:#f0f2f5;border:1px solid #eef0f3}
.heat i.l1{background:#d2dbff}.heat i.l2{background:#a9b9ff}.heat i.l3{background:#6f8cff}.heat i.l4{background:#1b4dff}
.heat i.today{box-shadow:0 0 0 2px #1b4dff}
.tabs{position:absolute;bottom:0;left:0;right:0;background:#fff;border-top:1px solid #e6e8ec;display:flex;padding:9px 6px 11px}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;gap:5px;color:#9aa1ad;font-size:10.5px;font-weight:600}
.tab.on{color:#1b4dff}
.tab .ic{width:38px;height:26px;border-radius:999px;display:flex;align-items:center;justify-content:center}
.tab.on .ic{background:#e9eeff}
.tab svg{width:21px;height:21px}
.tiles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.tile{background:#fff;border:1px solid #e6e8ec;border-radius:14px;padding:12px 12px 10px;display:flex;flex-direction:column;gap:2px}
.tile .n{font-family:'Bricolage Grotesque',system-ui,sans-serif;font-size:22px;font-weight:800;letter-spacing:-.02em;line-height:1.1}
.tile .l{font-size:12px;color:#6b7280}

.phone{height:844px;overflow:hidden}
.main{gap:14px}
.main{padding-bottom:120px}
  </style>
</helmet>

ius:5px;background:#6f8cff;border:1px solid #eef0f3"></i><i style="aspect-ratio:1;border-radius:5px;background:#f0f2f5;border:1px solid #eef0f3"></i><i style="aspect-ratio:1;border-radius:5px;background:#f0f2f5;border:1px solid #eef0f3"></i><i style="aspect-ratio:1;border-radius:5px;background:#1b4dff;border:1px solid #eef0f3"></i><i style="aspect-ratio:1;border-radius:5px;background:#a9b9ff;border:1px solid #eef0f3"></i><i style="aspect-ratio:1;border-radius:5px;background:#6f8cff;border:1px solid #eef0f3"></i><i style="aspect-ratio:1;border-radius:5px;background:#6f8cff;border:1px solid #eef0f3"></i><i style="aspect-ratio:1;border-radius:5px;background:#a9b9ff;border:1px solid #eef0f3"></i><i style="aspect-ratio:1;border-radius:5px;background:#a9b9ff;border:1px solid #eef0f3"></i><i style="aspect-ratio:1;border-radius:5px;background:#1b4dff;border:1px solid #eef0f3"></i><i style="aspect-ratio:1;border-radius:5px;background:#f0f2f5;border:1px solid #eef0f3"></i><i style="aspect-ratio:1;border-radius:5px;background:#f0f2f5;border:1px solid #eef0f3"></i><i style="aspect-ratio:1;border-radius:5px;background:#1b4dff;border:1px solid #eef0f3"></i><i style="aspect-ratio:1;border-radius:5px;background:#f0f2f5;border:1px solid #eef0f3"></i></div>
</div>
<div class="card" style="gap:0;padding:12px 18px">
  <div style="display:flex;justify-content:space-between;align-items:center;padding-bottom:6px"><span class="eyebrow">Từ hay sai · 6</span><span class="chip ok" style="height:32px">Ôn ngay</span></div>
